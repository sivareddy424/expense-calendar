function clone(o){return JSON.parse(JSON.stringify(o))}
function applySample(){Object.keys(DATA).forEach(k=>DATA[k]=clone(SAMPLE_DATA[k]||[]));state.currentUser={id:'sample-user',email:'sample@example.com',email_confirmed_at:new Date().toISOString(),created_at:new Date().toISOString(),last_sign_in_at:new Date().toISOString()};}
function n(v){const x=Number(v);return Number.isFinite(x)?x:0}
function money(v){return '₹'+n(v).toLocaleString('en-IN',{maximumFractionDigits:2})}
function dateKey(d){const x=d instanceof Date?d:new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`}
function monthKey(d){const x=d instanceof Date?d:new Date(d);return `${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}`}
function startMonth(d){const x=d instanceof Date?new Date(d):new Date(d);return new Date(x.getFullYear(),x.getMonth(),1)}
function addMonths(d,m){return new Date(d.getFullYear(),d.getMonth()+m,1)}
function monthLabel(d){return d.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}
function monthShort(d){return d.toLocaleDateString('en-IN',{month:'short'})}
function prettyDate(v){if(!v)return '—';const d=new Date(String(v).slice(0,10)+'T00:00:00');return Number.isNaN(d.getTime())?String(v):d.toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})}
function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function daysBetween(a,b){return Math.round((startOfDay(b)-startOfDay(a))/86400000)}
function frequencyMonths(f){const s=String(f||'Monthly').toLowerCase();if(s.includes('year'))return 12;if(s.includes('quarter'))return 3;if(s.includes('week'))return .25;return 1}
function scheduleKey(kind,id,month){return `${kind}|${id}|${monthKey(month)}`}
function isPaused(kind,id){return !!state.pause[scheduleKey(kind,id,new Date())]}
function isSkipped(kind,id,month){return !!state.skip[scheduleKey(kind,id,month)]}
function loadScheduleState(){try{const uid=state.currentUser?.id||'sample';state.skip=JSON.parse(localStorage.getItem('ec28-skip-'+uid)||'{}');state.pause=JSON.parse(localStorage.getItem('ec28-pause-'+uid)||'{}')}catch(_e){state.skip={};state.pause={}}}
function saveScheduleState(){const uid=state.currentUser?.id||'sample';try{localStorage.setItem('ec28-skip-'+uid,JSON.stringify(state.skip));localStorage.setItem('ec28-pause-'+uid,JSON.stringify(state.pause))}catch(_e){}}
function toggleSchedule(kind,id,month,mode){const k=scheduleKey(kind,id,month);if(mode==='skip'){if(state.skip[k])delete state.skip[k];else state.skip[k]=true}else{const nowKey=`${kind}|${id}|paused`;if(state.pause[nowKey])delete state.pause[nowKey];else state.pause[nowKey]=true}saveScheduleState();render()}
function dueOn(exp,month){const max=new Date(month.getFullYear(),month.getMonth()+1,0).getDate();const day=Math.min(max,Math.max(1,n(exp.due_day)||1));return new Date(month.getFullYear(),month.getMonth(),day)}
function recurringDue(exp,d){const start=new Date(String(exp.start_month||'1900-01')+'-01T00:00:00');if(Number.isNaN(start.getTime()))return false;const diff=(d.getFullYear()-start.getFullYear())*12+d.getMonth()-start.getMonth();const step=frequencyMonths(exp.frequency);if(diff<0)return false;return step<1?true:diff%step===0}
function recurringIncomeDue(x,d){const s=new Date((x.start_date||'1900-01-01')+'T00:00:00');const end=x.end_date?new Date(x.end_date+'T23:59:59'):null;if(d<s||(end&&d>end))return false;const diff=(d.getFullYear()-s.getFullYear())*12+d.getMonth()-s.getMonth();return diff>=0 && (frequencyMonths(x.frequency)<1||diff%frequencyMonths(x.frequency)===0)}
function recurringBillDue(x,d){const s=new Date((x.start_month||'1900-01')+'-01T00:00:00');if(d<s)return false;const diff=(d.getFullYear()-s.getFullYear())*12+d.getMonth()-s.getMonth();const step=frequencyMonths(x.frequency);return step<1||diff%step===0}
function occurrenceEvents(month){
  const out=[];const m=startMonth(month);
  for(const e of DATA.expenses){if(!recurringDue(e,m)||state.pause[`${'expense'}|${e.id}|paused`]||isSkipped('expense',e.id,m))continue;const d=dueOn(e,m);out.push({type:'expense',name:e.name,amount:n(e.amount),category:e.category||'Other',date:d,pay:getPaid(e.id,d),source:'Recurring expense',raw:e})}
  for(const x of DATA.recurringIncome){if(recurringIncomeDue(x,m)||false){if(state.pause[`${'recurringIncome'}|${x.id}|paused`]||isSkipped('recurringIncome',x.id,m))continue;const d=new Date(m.getFullYear(),m.getMonth(),1);out.push({type:'income',name:x.name,amount:n(x.amount),date:d,source:'Recurring income',raw:x})}}
  for(const l of DATA.loans){const d=new Date(m.getFullYear(),m.getMonth(),Math.min(28,Number(new Date(l.start_date||dateKey(m)).getDate()||1)));if(d>=startOfDay(new Date(l.start_date||m))&&!state.pause[`${'loan'}|${l.id}|paused`]&&!isSkipped('loan',l.id,m))out.push({type:'loan',name:l.name,amount:n(l.emi_amount),date:d,pay:false,source:'Loan EMI',raw:l,category:'Loan / EMI'})}
  for(const b of DATA.householdBills){const d=new Date(m.getFullYear(),m.getMonth(),Math.min(31,Math.max(1,n(b.due_day)||1)));if(recurringBillDue(b,m)&&!state.pause[`${'bill'}|${b.id}|paused`]&&!isSkipped('bill',b.id,m))out.push({type:'expense',name:b.name,amount:n(b.amount),date:d,pay:false,source:'Household bill',raw:b,category:b.category||'Household'})}
  for(const r of DATA.renewals){const d=new Date(String(r.due_date||'')+'T00:00:00');if(d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth())out.push({type:'expense',name:r.name,amount:n(r.amount),date:d,pay:false,source:'Renewal',raw:r,category:r.type||'Renewal'})}
  for(const x of DATA.oneTimeExpenses){const d=new Date(String(x.expense_date||'')+'T00:00:00');if(d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth())out.push({type:'expense',name:x.name,amount:n(x.amount),date:d,pay:getOneTimePaid(x.id,d),source:'One-time expense',raw:x,category:x.category||'Other'})}
  for(const x of DATA.income){const d=new Date(String(x.income_date||'')+'T00:00:00');if(d.getFullYear()===m.getFullYear()&&d.getMonth()===m.getMonth())out.push({type:'income',name:x.name,amount:n(x.amount),date:d,source:'Income',raw:x})}
  return out.sort((a,b)=>a.date-b.date)
}
function getPaid(expenseId,d){const k=String(expenseId)+'|'+dateKey(d);const row=DATA.payments.find(x=>`${x.expense_id}|${String(x.payment_date).slice(0,10)}`===k);return row?!!row.paid:false}
function getOneTimePaid(id,d){const k='ot|'+id+'|'+dateKey(d);return localStorage.getItem(k)==='1'}
function setOneTimePaid(id,d,paid){localStorage.setItem('ot|'+id+'|'+dateKey(d),paid?'1':'0')}
function allMonthEvents(month){return occurrenceEvents(month)}
function currentMonthStats(){const ev=allMonthEvents(state.month);const income=ev.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);const expense=ev.filter(x=>x.type!=='income').reduce((s,x)=>s+x.amount,0);const paid=ev.filter(x=>x.type!=='income'&&x.pay).reduce((s,x)=>s+x.amount,0);const pending=expense-paid;return{income,expense,paid,pending,net:income-expense,events:ev}}
function nextEvents(days=30){const out=[];const now=startOfDay(new Date());for(let i=0;i<days;i++){const d=new Date(now);d.setDate(d.getDate()+i);out.push(...allMonthEvents(d).filter(x=>dateKey(x.date)===dateKey(d)));}return out.sort((a,b)=>a.date-b.date||a.type.localeCompare(b.type))}
function greeting(){const h=new Date().getHours();if(h>=5&&h<12)return'Good morning';if(h>=12&&h<17)return'Good afternoon';if(h>=17&&h<22)return'Good evening';return'Good night'}
function health(){const st=currentMonthStats();const debt=DATA.loans.reduce((s,l)=>s+n(l.outstanding_amount),0);const pendingRatio=st.expense?st.pending/st.expense:0;const savingsRate=st.income?Math.max(-100,st.net/st.income*100):0;const debtPenalty=Math.min(25,debt>0?(debt/5000000)*25:0);let score=50+(savingsRate>=0?Math.min(30,savingsRate*.8):Math.max(-35,savingsRate*.5))-pendingRatio*20-debtPenalty;score=Math.max(0,Math.min(100,Math.round(score)));return{score,savingsRate,pendingRatio,surplus:st.net,debt}}

async function dbFetch(table){if(state.sample)return clone(DATA[TABLE_KEYS[table]||table]||[]);if(!supabaseClient||!state.currentUser)return[];let q=supabaseClient.from(table).select('*').eq('user_id',state.currentUser.id);const {data,error}=await q;if(error)throw error;return data||[]}
async function dbInsert(table,payload){if(state.sample){const key=TABLE_KEYS[table]||table;const id='s'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);const row={...payload,id};DATA[key].push(row);return row}const {data,error}=await supabaseClient.from(table).insert({user_id:state.currentUser.id,...payload}).select().single();if(error)throw error;return data}
async function dbUpdate(table,id,payload){if(state.sample){const key=TABLE_KEYS[table]||table;const i=DATA[key].findIndex(x=>x.id===id);if(i<0)throw Error('Record not found');DATA[key][i]={...DATA[key][i],...payload};return DATA[key][i]}const {data,error}=await supabaseClient.from(table).update(payload).eq('id',id).eq('user_id',state.currentUser.id).select().single();if(error)throw error;return data}
async function dbDelete(table,id){if(state.sample){const key=TABLE_KEYS[table]||table;DATA[key]=DATA[key].filter(x=>x.id!==id);return}const {error}=await supabaseClient.from(table).delete().eq('id',id).eq('user_id',state.currentUser.id);if(error)throw error}
async function dbUpsert(table,payload,conflict){if(state.sample){const key=TABLE_KEYS[table]||table;const match=DATA[key].findIndex(x=>(conflict||[]).every(k=>x[k]===payload[k]));if(match>=0){DATA[key][match]={...DATA[key][match],...payload};return DATA[key][match]}return dbInsert(table,payload)}const {data,error}=await supabaseClient.from(table).upsert({user_id:state.currentUser.id,...payload},{onConflict:conflict}).select().single();if(error)throw error;return data}
async function loadData(){if(state.sample){applySample();return}if(!supabaseClient){throw Error('Supabase library did not load.');}const {data:{session},error}=await supabaseClient.auth.getSession();if(error)throw error;if(!session){showAuth();return}state.currentUser=session.user;for(const table of TABLES){try{const data=await dbFetch(table);DATA[TABLE_KEYS[table]]=data}catch(e){console.warn(table,e.message)}}try{const hs=await supabaseClient.from('shared_households').select('*');if(!hs.error){DATA.sharedHouseholds=hs.data||[];if(DATA.sharedHouseholds.length){const ids=DATA.sharedHouseholds.map(x=>x.id);const m=await supabaseClient.from('shared_household_members').select('*').in('household_id',ids);if(!m.error)DATA.sharedMembers=m.data||[];const sx=await supabaseClient.from('shared_expenses').select('*').in('household_id',ids);if(!sx.error)DATA.sharedExpenses=sx.data||[]}}}catch(_e){} }

<div class="grid-2"><section class="panel"><div class="panel-head"><div><h2>What needs your attention?</h2><div class="muted">Only actionable items are shown here.</div></div><span class="pill info">${att.length} alerts</span></div><div class="list">${att.length?att.map(a=>`<div class="item attention ${a.kind}"><div class="item-title">${a.title}</div><div class="item-meta">${a.desc}</div><div class="item-actions"><button class="btn-ghost" data-action="${a.action}">Open</button></div></div>`).join(''):'<div class="empty">✓ Nothing urgent right now.</div>'}</div></section><section class="panel"><div class="panel-head"><div><h2>Next 7 days</h2><div class="muted">Upcoming money commitments.</div></div><button class="btn-ghost" data-action="tab-calendar">Calendar</button></div><div class="timeline">${next.length?next.map(x=>`<div class="timeline-row"><div class="timeline-date">${prettyDate(x.date)}</div><div class="timeline-main"><div class="timeline-title">${escapeHtml(x.name)}</div><div class="timeline-meta">${escapeHtml(x.source)} · ${x.pay===false?'Pending':'Upcoming'}</div></div><div class="orange">${money(x.amount)}</div></div>`).join(''):'<div class="empty">No upcoming commitments.</div>'}</div></section></div>
<section class="panel"><div class="panel-head"><div><h2>Recent activity</h2><div class="muted">Latest cash-flow and investment entries.</div></div><button class="btn-ghost" data-action="tab-money">View Money</button></div><div class="list">${recent.length?recent.map(x=>`<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(x.name)}</div><div class="item-meta">${x.type} · ${prettyDate(x.date)}</div></div><b class="${x.type==='Income'?'green':'red'}">${money(x.amount)}</b></div></div>`).join(''):'<div class="empty">No recent activity.</div>'}</div></section>`}

function renderCalendar(){const y=state.month.getFullYear(),m=state.month.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay()),ev=allMonthEvents(state.month).filter(x=>filterCal(x));let cells='';const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];cells+=days.map(x=>`<div class="dow">${x}</div>`).join('');for(let i=0;i<42;i++){const d=new Date(start);d.setDate(start.getDate()+i);const ds=dateKey(d);const mine=ev.filter(x=>dateKey(x.date)===ds);const cls=[d.getMonth()!==m?'muted-day':'',ds===dateKey(new Date())?'today':''].join(' ');cells+=`<div class="day ${cls}"><div class="day-num">${d.getDate()}</div>${mine.slice(0,5).map(x=>`<div class="event ${x.type==='income'?'income':''} ${x.type==='loan'?'loan':''} ${x.pay===false?'pending':''}"><span class="event-name">${escapeHtml(x.name)}</span><span class="event-amt">${money(x.amount)}</span></div>`).join('')}</div>`}const st=currentMonthStats();return `<section class="panel"><div class="calendar-head"><div><h2>${monthLabel(state.month)}</h2><div class="muted">One calendar. Income, expenses, EMIs, bills, renewals and one-time entries.</div></div><div class="toolbar"><button class="btn-gray" data-action="prev-month">◀</button><button class="btn" data-action="today-month">Today</button><button class="btn-gray" data-action="next-month">▶</button></div></div><div class="calendar-filters">${[['all','All'],['income','Income'],['expense','Expense'],['paid','Paid'],['pending','Pending']].map(([id,l])=>`<button class="chip ${state.calendarFilter===id?'active':''}" data-action="cal-filter" data-filter="${id}">${l}</button>`).join('')}</div></section><section class="panel"><div class="calendar-grid">${cells}</div></section><div class="grid-2"><section class="panel"><div class="panel-head"><div><h2>Selected month summary</h2><div class="muted">Same source of truth as Money.</div></div></div><div class="grid-3"><div class="kpi"><div class="kpi-label">Income</div><div class="kpi-value green">${money(st.income)}</div></div><div class="kpi"><div class="kpi-label">Paid</div><div class="kpi-value green">${money(st.paid)}</div></div><div class="kpi"><div class="kpi-label">Pending</div><div class="kpi-value orange">${money(st.pending)}</div></div></div></section><section class="panel"><div class="panel-head"><div><h2>Upcoming</h2><div class="muted">Next scheduled entries.</div></div></div><div class="list">${nextEvents(31).slice(0,8).map(x=>`<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(x.name)}</div><div class="item-meta">${prettyDate(x.date)} · ${escapeHtml(x.source)}</div></div><b class="orange">${money(x.amount)}</b></div></div>`).join('')||'<div class="empty">Nothing scheduled.</div>'}</div></section></div>`}
function filterCal(x){if(state.calendarFilter==='income')return x.type==='income';if(state.calendarFilter==='expense')return x.type!=='income';if(state.calendarFilter==='paid')return x.type!=='income'&&x.pay===true;if(state.calendarFilter==='pending')return x.type!=='income'&&x.pay!==true;return true}

function renderMoney(){const sub=state.sub.money||'ledger';const base=`<section class="panel"><div class="panel-head"><div><h2>Money</h2><div class="muted">Every cash-flow item belongs here once. Cards, investments and net worth have their own subtabs.</div></div><div class="toolbar"><input id="moneySearch" value="${escapeHtml(state.moneySearch)}" placeholder="Search entries…"><button class="chip ${state.moneyFilter==='all'?'active':''}" data-action="money-filter" data-filter="all">All</button><button class="chip ${state.moneyFilter==='income'?'active':''}" data-action="money-filter" data-filter="income">Income</button><button class="chip ${state.moneyFilter==='expense'?'active':''}" data-action="money-filter" data-filter="expense">Expense</button></div></div>${sub==='ledger'?renderLedger():sub==='recurring'?renderRecurring():sub==='cards'?renderCards():sub==='investments'?renderInvestments():renderNetWorth()}</section>`;return base}
function renderLedger(){let ev=allMonthEvents(state.month).filter(x=>x.type!=='life');if(state.moneyFilter!=='all')ev=ev.filter(x=>state.moneyFilter==='income'?x.type==='income':x.type!=='income');const q=state.moneySearch.toLowerCase();if(q)ev=ev.filter(x=>(x.name+' '+x.source+' '+(x.category||'')).toLowerCase().includes(q));ev.sort((a,b)=>a.date-b.date);const income=ev.filter(x=>x.type==='income'),expense=ev.filter(x=>x.type!=='income');const renderList=(xs,kind)=>`<div class="list">${xs.length?xs.map(x=>`<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(x.name)}</div><div class="item-meta">${prettyDate(x.date)} · ${escapeHtml(x.source)} · ${escapeHtml(x.category||'')}</div></div><div><b class="${kind==='income'?'green':'red'}">${money(x.amount)}</b><div class="item-meta" style="text-align:right">${kind==='expense'?(x.pay?'PAID':'PENDING'):'INCOME'}</div></div></div><div class="item-actions">${x.source==='Recurring expense'?`<button class="btn-ghost" data-action="edit-record" data-kind="expense" data-id="${x.raw.id}">Edit</button><button class="btn-ghost" data-action="toggle-paid" data-id="${x.raw.id}" data-date="${dateKey(x.date)}">${x.pay?'Mark pending':'Mark paid'}</button>`:''}${x.source==='One-time expense'?`<button class="btn-ghost" data-action="edit-record" data-kind="oneTime" data-id="${x.raw.id}">Edit</button><button class="btn-ghost" data-action="toggle-one-paid" data-id="${x.raw.id}" data-date="${dateKey(x.date)}">${x.pay?'Mark pending':'Mark paid'}</button>`:''}${x.source==='Income'?`<button class="btn-ghost" data-action="edit-record" data-kind="income" data-id="${x.raw.id}">Edit</button>`:''}</div></div>`).join(''):'<div class="empty">No entries for this view.</div>'}</div>`;return `<div class="grid-2"><div><h3>🟢 Income</h3>${renderList(income,'income')}</div><div><h3>🔴 Expense</h3>${renderList(expense,'expense')}</div></div>`}
function renderRecurring(){
  const rows=[...DATA.expenses.map(x=>({kind:'expense',id:x.id,name:x.name,amount:n(x.amount),frequency:x.frequency,category:x.category})),...DATA.recurringIncome.map(x=>({kind:'recurringIncome',id:x.id,name:x.name,amount:n(x.amount),frequency:x.frequency,category:'Income'})),...DATA.loans.map(x=>({kind:'loan',id:x.id,name:x.name,amount:n(x.emi_amount),frequency:'Monthly',category:'Loan / EMI'}))];
  const cm=startMonth(new Date());
  return `<div class="list">${rows.length?rows.map(x=>{const paused=!!state.pause[`${x.kind}|${x.id}|paused`],skip=!!state.skip[scheduleKey(x.kind,x.id,cm)];return `<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(x.name)} ${paused?'<span class="pill warn">Paused</span>':''} ${skip?'<span class="pill info">Skipped this month</span>':''}</div><div class="item-meta">${escapeHtml(x.category||'')} · ${escapeHtml(x.frequency||'')}</div></div><b>${money(x.amount)}</b></div><div class="item-actions"><button class="btn-ghost" data-action="edit-record" data-kind="${x.kind}" data-id="${x.id}">Edit</button>${x.kind==='expense'||x.kind==='loan'?`<button class="btn-ghost" data-action="history" data-kind="${x.kind}" data-id="${x.id}">History</button>`:''}<button class="btn-ghost" data-action="toggle-skip" data-kind="${x.kind}" data-id="${x.id}">${skip?'Unskip this month':'Skip this month'}</button><button class="btn-ghost" data-action="toggle-pause" data-kind="${x.kind}" data-id="${x.id}">${paused?'Resume':'Pause'}</button></div></div>`}).join(''):'<div class="empty">No recurring schedules.</div>'}</div>`
}
function renderCards(){const total=DATA.creditCards.reduce((s,x)=>s+n(x.current_used),0),limit=DATA.creditCards.reduce((s,x)=>s+n(x.credit_limit),0);return `<div class="kpis"><div class="kpi"><div class="kpi-label">Used</div><div class="kpi-value red">${money(total)}</div></div><div class="kpi"><div class="kpi-label">Limit</div><div class="kpi-value blue">${money(limit)}</div></div><div class="kpi"><div class="kpi-label">Utilization</div><div class="kpi-value orange">${limit?((total/limit)*100).toFixed(1):0}%</div></div></div><div class="list">${DATA.creditCards.length?DATA.creditCards.map(c=>`<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(c.name)}</div><div class="item-meta">${escapeHtml(c.bank||'Card')} · Bill day ${c.billing_day} · Due day ${c.due_day}</div></div><b class="red">${money(c.current_used)}</b></div><div class="progress" style="margin-top:8px"><div style="width:${Math.min(100,(n(c.current_used)/Math.max(1,n(c.credit_limit)))*100)}%"></div></div><div class="item-actions"><button class="btn-ghost" data-action="edit-record" data-kind="card" data-id="${c.id}">Edit</button><button class="btn-danger" data-action="delete-record" data-kind="card" data-id="${c.id}">Delete</button></div></div>`).join(''):'<div class="empty">No credit cards.</div>'}</div><div style="margin-top:10px"><button class="btn" data-action="add-record" data-kind="card">＋ Add card</button></div>`}
function renderInvestments(){const invested=DATA.investments.reduce((s,x)=>s+n(x.invested_amount),0),value=DATA.investments.reduce((s,x)=>s+n(x.current_value),0);return `<div class="kpis"><div class="kpi"><div class="kpi-label">Invested</div><div class="kpi-value">${money(invested)}</div></div><div class="kpi"><div class="kpi-label">Current value</div><div class="kpi-value blue">${money(value)}</div></div><div class="kpi"><div class="kpi-label">Gain / loss</div><div class="kpi-value ${value-invested>=0?'green':'red'}">${money(value-invested)}</div></div><div class="kpi"><div class="kpi-label">Return</div><div class="kpi-value purple">${invested?((value/invested-1)*100).toFixed(1):0}%</div></div></div><div class="list">${DATA.investments.length?DATA.investments.map(i=>`<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(i.name)}</div><div class="item-meta">${escapeHtml(i.type||'Investment')} · ${prettyDate(i.investment_date)}</div></div><b class="${n(i.current_value)-n(i.invested_amount)>=0?'green':'red'}">${money(i.current_value)}</b></div><div class="item-meta">Invested ${money(i.invested_amount)} · Gain ${money(n(i.current_value)-n(i.invested_amount))}</div><div class="item-actions"><button class="btn-ghost" data-action="edit-record" data-kind="investment" data-id="${i.id}">Edit</button><button class="btn-danger" data-action="delete-record" data-kind="investment" data-id="${i.id}">Delete</button></div></div>`).join(''):'<div class="empty">No investments.</div>'}</div><div style="margin-top:10px"><button class="btn" data-action="add-record" data-kind="investment">＋ Add investment</button></div>`}
function renderNetWorth(){const assets=DATA.assets.reduce((s,x)=>s+n(x.current_value),0),inv=DATA.investments.reduce((s,x)=>s+n(x.current_value),0),debt=DATA.loans.reduce((s,x)=>s+n(x.outstanding_amount),0)+DATA.creditCards.reduce((s,x)=>s+n(x.current_used),0);return `<div class="kpis"><div class="kpi"><div class="kpi-label">Assets</div><div class="kpi-value green">${money(assets+inv)}</div></div><div class="kpi"><div class="kpi-label">Liabilities</div><div class="kpi-value red">${money(debt)}</div></div><div class="kpi"><div class="kpi-label">Net worth</div><div class="kpi-value blue">${money(assets+inv-debt)}</div></div></div><div class="grid-2"><div><h3>Assets</h3><div class="list">${DATA.assets.length?DATA.assets.map(a=>`<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(a.name)}</div><div class="item-meta">${escapeHtml(a.category||'Asset')}</div></div><b class="green">${money(a.current_value)}</b></div><div class="item-actions"><button class="btn-ghost" data-action="edit-record" data-kind="asset" data-id="${a.id}">Edit</button><button class="btn-danger" data-action="delete-record" data-kind="asset" data-id="${a.id}">Delete</button></div></div>`).join(''):'<div class="empty">No assets.</div>'}</div><button class="btn" style="margin-top:10px" data-action="add-record" data-kind="asset">＋ Add asset</button></div><div><h3>Liabilities</h3><div class="list">${DATA.loans.map(l=>`<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(l.name)}</div><div class="item-meta">Loan · ${escapeHtml(l.lender||'')}</div></div><b class="red">${money(l.outstanding_amount)}</b></div></div>`).join('')||'<div class="empty">No loans.</div>'}</div></div></div>`}

function renderPlanning(){const sub=state.sub.planning||'loans';return `<section class="panel"><div class="panel-head"><div><h2>Planning</h2><div class="muted">One place for liabilities, goals, budgets and forward planning.</div></div></div>${sub==='loans'?renderLoans():sub==='goals'?renderGoals():sub==='budgets'?renderBudgets():renderForecast()}</section>`}
function renderLoans(){const loan=state.selectedLoan?DATA.loans.find(x=>x.id===state.selectedLoan):DATA.loans[0];return `<div class="grid-2"><div><div class="panel-head"><div><h3>Loans</h3><div class="muted">Outstanding balance and EMI.</div></div><button class="btn" data-action="add-record" data-kind="loan">＋ Add loan</button></div><div class="list">${DATA.loans.length?DATA.loans.map(l=>`<div class="item ${loan?.id===l.id?'attention':''}"><div class="item-head"><div><div class="item-title">${escapeHtml(l.name)}</div><div class="item-meta">${escapeHtml(l.lender||'')} · ${n(l.interest_rate).toFixed(2)}% · EMI ${money(l.emi_amount)}</div></div><b class="red">${money(l.outstanding_amount)}</b></div><div class="item-actions"><button class="btn-ghost" data-action="select-loan" data-id="${l.id}">Payoff calculator</button><button class="btn-ghost" data-action="edit-record" data-kind="loan" data-id="${l.id}">Edit</button><button class="btn-danger" data-action="delete-record" data-kind="loan" data-id="${l.id}">Delete</button></div></div>`).join(''):'<div class="empty">No loans added.</div>'}</div></div><div><h3>Loan payoff simulator</h3>${loan?renderLoanSimulator(loan):'<div class="empty">Select a loan.</div>'}</div></div>`}
function loanCalc(loan,extra){const p=n(loan.outstanding_amount),emi=n(loan.emi_amount)+Math.max(0,n(extra)),annual=n(loan.interest_rate),r=annual/1200;let bal=p,months=0,interest=0;if(p<=0)return{months:0,interest:0,finish:new Date()};while(bal>0.01&&months<600){const int=bal*r,principal=emi-int;if(principal<=0) return {months:Infinity,interest:Infinity,finish:null};bal=Math.max(0,bal-principal);interest+=int;months++}const finish=new Date();if(Number.isFinite(months))finish.setMonth(finish.getMonth()+months);return{months,interest,finish}}
function renderLoanSimulator(l){const extra=Number(document.getElementById('loanExtra')?.value||0),base=loanCalc(l,0),sim=loanCalc(l,extra);const savedMonths=(Number.isFinite(base.months)&&Number.isFinite(sim.months))?Math.max(0,base.months-sim.months):0;const savedInterest=(Number.isFinite(base.interest)&&Number.isFinite(sim.interest))?Math.max(0,base.interest-sim.interest):0;return `<div class="panel" id="loanSimulatorBody" style="margin-top:10px"><div class="modal-note">The calculation always starts from today. Changing the extra payment never changes Calendar, Money or Reports month.</div><div class="field" style="margin-top:10px"><label>Extra monthly payment</label><input id="loanExtra" type="number" min="0" step="500" value="${extra}"></div><div class="kpis" style="margin-top:10px"><div class="kpi"><div class="kpi-label">Current EMI</div><div class="kpi-value">${money(l.emi_amount)}</div></div><div class="kpi"><div class="kpi-label">New monthly payment</div><div class="kpi-value blue" data-out="payment">${money(n(l.emi_amount)+extra)}</div></div><div class="kpi"><div class="kpi-label">Months saved</div><div class="kpi-value green" data-out="months">${savedMonths}</div></div><div class="kpi"><div class="kpi-label">Interest saved</div><div class="kpi-value green" data-out="interest">${money(savedInterest)}</div></div></div><div class="item-meta">Base finish · simulated finish: <span data-out="finish">${base.finish?prettyDate(base.finish):'Not payable'} · ${sim.finish?prettyDate(sim.finish):'Not payable'}</span></div></div>`}
function renderGoals(){return `<div class="panel-head"><div><h3>Savings goals</h3><div class="muted">Targets appear once, here.</div></div><button class="btn" data-action="add-record" data-kind="goal">＋ Add goal</button></div><div class="list">${DATA.savingsGoals.length?DATA.savingsGoals.map(g=>{const target=n(g.target_amount),cur=n(g.current_amount),pct=target?Math.min(100,cur/target*100):0,left=Math.max(0,target-cur);const months=g.target_date?Math.max(1,Math.ceil(daysBetween(new Date(),new Date(g.target_date))/30)):24;return `<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(g.name)}</div><div class="item-meta">${money(cur)} / ${money(target)} · ${g.target_date?prettyDate(g.target_date):'No target date'}</div></div><b class="blue">${pct.toFixed(0)}%</b></div><div class="progress" style="margin-top:8px"><div style="width:${pct}%"></div></div><div class="item-meta" style="margin-top:7px">Need about ${money(left/months)}/month</div><div class="item-actions"><button class="btn-green" data-action="goal-add" data-id="${g.id}">＋ Saving</button><button class="btn-ghost" data-action="edit-record" data-kind="goal" data-id="${g.id}">Edit</button><button class="btn-danger" data-action="delete-record" data-kind="goal" data-id="${g.id}">Delete</button></div></div>`}).join(''):'<div class="empty">No goals added.</div>'}</div>`}
function renderBudgets(){const spentBy={};allMonthEvents(state.month).filter(x=>x.type!=='income').forEach(x=>{spentBy[x.category||'Other']=(spentBy[x.category||'Other']||0)+x.amount});return `<div class="panel-head"><div><h3>Budgets</h3><div class="muted">Monthly category limits.</div></div><button class="btn" data-action="add-record" data-kind="budget">＋ Add budget</button></div><div class="list">${DATA.budgets.length?DATA.budgets.map(b=>{const used=n(spentBy[b.category]),limit=n(b.monthly_limit),pct=limit?used/limit*100:0;return `<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(b.category)}</div><div class="item-meta">Used ${money(used)} of ${money(limit)}</div></div><b class="${pct>100?'red':pct>80?'orange':'green'}">${pct.toFixed(0)}%</b></div><div class="progress" style="margin-top:8px"><div style="width:${Math.min(100,pct)}%"></div></div><div class="item-actions"><button class="btn-ghost" data-action="edit-record" data-kind="budget" data-id="${b.id}">Edit</button><button class="btn-danger" data-action="delete-record" data-kind="budget" data-id="${b.id}">Delete</button></div></div>`}).join(''):'<div class="empty">No budgets added.</div>'}</div>`}
function renderForecast(){const months=[];for(let i=0;i<6;i++){const d=addMonths(state.month,i),s=currentMonthStatsFor(d);months.push({d,s})}const max=Math.max(1,...months.flatMap(x=>[x.s.income,x.s.expense]));return `<div class="panel-head"><div><h3>Six-month forecast</h3><div class="muted">Projected recurring and one-time commitments.</div></div></div><div class="chart">${months.map(x=>`<div class="bar-col"><div class="bar-value">${money(x.s.net)}</div><div class="bar" style="height:${Math.max(8,Math.abs(x.s.net)/max*120)}px"></div><div class="bar-label">${monthShort(x.d)}</div></div>`).join('')}</div><div class="grid-3">${months.map(x=>`<div class="kpi"><div class="kpi-label">${monthLabel(x.d)}</div><div class="kpi-value ${x.s.net>=0?'green':'red'}">${money(x.s.net)}</div><div class="small">${money(x.s.income)} income · ${money(x.s.expense)} expense</div></div>`).join('')}</div>`}
function currentMonthStatsFor(d){const ev=allMonthEvents(d);const income=ev.filter(x=>x.type==='income').reduce((s,x)=>s+x.amount,0);const expense=ev.filter(x=>x.type!=='income').reduce((s,x)=>s+x.amount,0);return{income,expense,net:income-expense}}

function renderReports(){const sub=state.sub.reports||'twelve';return `<section class="panel"><div class="panel-head"><div><h2>Reports</h2><div class="muted">Simple trends, no duplicated dashboards.</div></div></div>${sub==='twelve'?renderTwelve():renderAnnual()}</section>`}
function renderTwelve(){const rows=[];for(let i=11;i>=0;i--){const d=addMonths(state.month,-i),s=currentMonthStatsFor(d);rows.push({d,s})}const max=Math.max(1,...rows.flatMap(x=>[x.s.income,x.s.expense]));return `<div class="panel"><div class="chart">${rows.map(x=>`<div class="bar-col"><div class="bar-value">${money(x.s.net)}</div><div class="bar" style="height:${Math.max(8,Math.abs(x.s.net)/max*125)}px"></div><div class="bar-label">${monthShort(x.d)}</div></div>`).join('')}</div></div><div class="table-wrap"><table class="table"><thead><tr><th>Month</th><th>Income</th><th>Expense</th><th>Net</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${monthLabel(x.d)}</td><td class="green">${money(x.s.income)}</td><td class="red">${money(x.s.expense)}</td><td class="${x.s.net>=0?'green':'red'}">${money(x.s.net)}</td></tr>`).join('')}</tbody></table></div>`}
function renderAnnual(){const y=state.month.getFullYear();const rows={};for(const e of DATA.expenses){const cat=e.category||'Other';rows[cat]=(rows[cat]||0)+n(e.amount)*(12/Math.max(.25,frequencyMonths(e.frequency)))}for(const o of DATA.oneTimeExpenses){const d=new Date(o.expense_date||'');if(d.getFullYear()===y)rows[o.category||'Other']=(rows[o.category||'Other']||0)+n(o.amount)}const entries=Object.entries(rows).sort((a,b)=>b[1]-a[1]);return `<div class="grid-2"><div><h3>Annual recurring commitments</h3><div class="list">${entries.length?entries.map(([cat,v])=>`<div class="item"><div class="item-head"><div class="item-title">${escapeHtml(cat)}</div><b class="red">${money(v)}</b></div></div>`).join(''):'<div class="empty">No annual expenses.</div>'}</div></div><div><h3>Annual snapshot</h3><div class="list"><div class="item"><div class="item-title">Recurring expenses</div><div class="item-meta">${money(DATA.expenses.reduce((s,e)=>s+n(e.amount)*(12/Math.max(.25,frequencyMonths(e.frequency))),0))}</div></div><div class="item"><div class="item-title">Loans outstanding</div><div class="item-meta">${money(DATA.loans.reduce((s,l)=>s+n(l.outstanding_amount),0))}</div></div><div class="item"><div class="item-title">Current investments</div><div class="item-meta">${money(DATA.investments.reduce((s,i)=>s+n(i.current_value),0))}</div></div></div></div></div>`}

function renderInsights(){const sub=state.sub.insights||'health';return `<section class="panel"><div class="panel-head"><div><h2>Insights</h2><div class="muted">Analysis and utilities live here once.</div></div></div>${sub==='health'?renderHealth():sub==='assistant'?renderAssistant():renderTools()}</section>`}
function renderHealth(){const h=health(),st=currentMonthStats();return `<div class="grid-2"><div class="panel"><div class="health-card"><div><div class="muted">Financial health</div><div class="health-score">${h.score}<span class="muted">/100</span></div><div class="muted">Savings rate ${h.savingsRate.toFixed(1)}%</div></div><div class="health-ring" style="--score:${h.score}%"><b>${h.score}</b></div></div></div><div><div class="list"><div class="item"><div class="item-title">Cash flow</div><div class="item-meta">${money(st.income)} income vs ${money(st.expense)} expense</div></div><div class="item"><div class="item-title">Pending commitments</div><div class="item-meta">${money(st.pending)} pending this month</div></div><div class="item"><div class="item-title">Debt</div><div class="item-meta">${money(h.debt)} total tracked debt</div></div></div></div></div><div class="panel"><h3>Why this score?</h3><div class="list"><div class="item attention ${st.net<0?'bad':'good'}"><div class="item-title">${st.net<0?'Expenses exceed income':'Monthly surplus is positive'}</div><div class="item-meta">${st.net<0?'Reduce non-essential spending or increase income.':'Keep the surplus consistent and fund goals first.'}</div></div><div class="item attention ${st.pending/st.expense>.4?'warn':'good'}"><div class="item-title">${st.pending?'Payment tracking':'Payment tracking looks clear'}</div><div class="item-meta">${st.pending?money(st.pending)+' remains pending.':'No major pending burden is showing.'}</div></div></div></div>`}
function renderAssistant(){const st=currentMonthStats(),h=health(),top=DATA.expenses.slice().sort((a,b)=>n(b.amount)-n(a.amount)).slice(0,3);return `<div class="grid-2"><div class="panel"><h3>Financial assistant</h3><p class="muted">Based on your current data, your ${monthLabel(state.month)} net position is <b>${money(st.net)}</b>. ${st.net<0?'The biggest priority is reducing planned outflow.':'The next priority is keeping the surplus and funding goals.'}</p><div class="list">${top.map(x=>`<div class="item"><div class="item-title">${escapeHtml(x.name)}</div><div class="item-meta">Recurring ${money(x.amount)} · ${escapeHtml(x.category||'Other')}</div></div>`).join('')||'<div class="empty">No recurring expenses.</div>'}</div></div><div class="panel"><h3>Suggested next steps</h3><div class="list"><div class="item">Keep at least one month of expenses in your emergency goal.</div><div class="item">Use the loan simulator before increasing EMI payments.</div><div class="item">Review any budget above 80% utilization.</div><div class="item">Check Renewals & Bills for upcoming commitments.</div></div></div></div>`}
function renderTools(){return `<div class="grid-2"><div class="panel"><div class="panel-head"><div><h3>Recurring expense intelligence</h3><div class="muted">Find annual cost and largest recurring commitments.</div></div><span class="pill info">Live</span></div>${renderRecurringIntelligence()}</div><div class="panel"><div class="panel-head"><div><h3>Smart rules</h3><div class="muted">Alerts that never modify your money.</div></div><button class="btn" data-action="add-record" data-kind="rule">＋ Rule</button></div>${renderRules()}</div><div class="panel"><div class="panel-head"><div><h3>Reminder center</h3><div class="muted">What may need attention soon.</div></div></div>${renderReminders()}</div><div class="panel"><div class="panel-head"><div><h3>Household</h3><div class="muted">Shared expenses and household records.</div></div><div class="toolbar"><button class="btn-ghost" data-action="create-household">＋ Household</button><button class="btn" data-action="add-record" data-kind="shared">＋ Shared expense</button></div></div>${renderShared()}</div><div class="panel"><div class="panel-head"><div><h3>Vehicles</h3><div class="muted">Vehicles and their running costs.</div></div><button class="btn" data-action="add-record" data-kind="vehicle">＋ Vehicle</button></div>${renderVehicles()}</div><div class="panel"><div class="panel-head"><div><h3>Life events</h3><div class="muted">Planned major expenses and funding targets.</div></div><button class="btn" data-action="add-record" data-kind="life">＋ Life event</button></div>${renderLifeEvents()}</div><div class="panel"><div class="panel-head"><div><h3>Renewals & Bills</h3<div class="muted">Single place for scheduled household obligations.</div></div><div class="toolbar"><button class="btn-ghost" data-action="add-record" data-kind="renewal">＋ Renewal</button><button class="btn-ghost" data-action="add-record" data-kind="bill">＋ Bill</button></div></div>${renderRenewalsBills()}</div></div>`}
function renderRecurringIntelligence(){const annual=DATA.expenses.reduce((s,e)=>s+n(e.amount)*(12/Math.max(.25,frequencyMonths(e.frequency))),0),top=DATA.expenses.slice().sort((a,b)=>n(b.amount)-n(a.amount)).slice(0,5),cats={};DATA.expenses.forEach(e=>cats[e.category||'Other']=(cats[e.category||'Other']||0)+n(e.amount)*(12/Math.max(.25,frequencyMonths(e.frequency))));const catTop=Object.entries(cats).sort((a,b)=>b[1]-a[1]).slice(0,4);return `<div class="kpis"><div class="kpi"><div class="kpi-label">Annual recurring</div><div class="kpi-value red">${money(annual)}</div></div><div class="kpi"><div class="kpi-label">Monthly recurring</div><div class="kpi-value">${money(annual/12)}</div></div><div class="kpi"><div class="kpi-label">Schedules</div><div class="kpi-value blue">${DATA.expenses.length}</div></div></div><div class="grid-2"><div><h4>Largest schedules</h4><div class="list">${top.map(e=>`<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(e.name)}</div><div class="item-meta">${escapeHtml(e.category||'Other')} · ${e.frequency||'Monthly'}</div></div><b class="red">${money(e.amount)}</b></div></div>`).join('')||'<div class="empty">No recurring expenses.</div>'}</div></div><div><h4>Annual cost by category</h4><div class="list">${catTop.map(([c,v])=>`<div class="item"><div class="item-head"><div class="item-title">${escapeHtml(c)}</div><b>${money(v)}</b></div></div>`).join('')||'<div class="empty">No categories yet.</div>'}</div></div></div>`}
function renderRules(){return DATA.financeRules.length?`<div class="list">${DATA.financeRules.map(r=>`<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(r.name)}</div><div class="item-meta">${escapeHtml(r.rule_type||'Rule')} ${r.category?`· ${escapeHtml(r.category)}`:''}</div></div><span class="pill ${r.enabled===false?'warn':'good'}">${r.enabled===false?'Off':'On'}</span></div><div class="item-actions"><button class="btn-ghost" data-action="edit-record" data-kind="rule" data-id="${r.id}">Edit</button><button class="btn-danger" data-action="delete-record" data-kind="rule" data-id="${r.id}">Delete</button></div></div>`).join('')}</div>`:'<div class="empty">No smart rules.</div>'}
function renderReminders(){const now=startOfDay(new Date()),rows=[];for(const r of DATA.renewals){const d=new Date(String(r.due_date||'')+'T00:00:00'),days=daysBetween(now,d);if(days<=Math.max(30,n(r.reminder_days)||14))rows.push({title:r.name,meta:`Renewal · ${days<0?'overdue':days===0?'today':days+' days'}`,amount:r.amount,kind:days<0?'bad':'warn'})}for(const x of nextEvents(14).slice(0,6)){rows.push({title:x.name,meta:`${x.source} · ${prettyDate(x.date)}`,amount:x.amount,kind:'info'})}return `<div class="list">${rows.slice(0,8).map(r=>`<div class="item attention ${r.kind}"><div class="item-head"><div><div class="item-title">${escapeHtml(r.title)}</div><div class="item-meta">${escapeHtml(r.meta)}</div></div><b>${money(r.amount)}</b></div></div>`).join('')||'<div class="empty">No reminders right now.</div>'}</div>`}
function renderShared(){const head=DATA.sharedHouseholds.length?`<div class="item-actions" style="margin-bottom:8px"><button class="btn-ghost" data-action="invite-household">Invite member</button></div>`:'';const list=DATA.sharedExpenses.length?`<div class="list">${DATA.sharedExpenses.map(x=>`<div class="item"><div class="item-head"><div class="item-title">${escapeHtml(x.name||x.description||'Shared expense')}</div><b>${money(x.amount)}</b></div><div class="item-meta">${prettyDate(x.expense_date)}</div></div>`).join('')}</div>`:'<div class="empty">No shared expenses in view.</div>';return head+list}
function renderVehicles(){return DATA.vehicles.length?`<div class="list">${DATA.vehicles.map(v=>{const logs=DATA.vehicleLogs.filter(x=>x.vehicle_id===v.id).sort((a,b)=>new Date(b.log_date)-new Date(a.log_date)).slice(0,4);return `<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(v.name)}</div><div class="item-meta">${escapeHtml(v.type||v.vehicle_type||'Vehicle')} · Value ${money(v.current_value)} ${v.insurance_date?'· Insurance '+prettyDate(v.insurance_date):''}</div></div><div class="item-actions"><button class="btn-ghost" data-action="vehicle-log" data-id="${v.id}">＋ Log cost</button><button class="btn-ghost" data-action="edit-record" data-kind="vehicle" data-id="${v.id}">Edit</button><button class="btn-danger" data-action="delete-record" data-kind="vehicle" data-id="${v.id}">Delete</button></div></div>${logs.length?`<div class="list" style="margin-top:8px">${logs.map(l=>`<div class="timeline-row"><div class="timeline-date">${prettyDate(l.log_date)}</div><div class="timeline-main"><div class="timeline-title">${escapeHtml(l.log_type||'Cost')}</div><div class="timeline-meta">${l.odometer?l.odometer.toLocaleString('en-IN')+' km · ':''}${escapeHtml(l.note||'')}</div></div><b>${money(l.amount)}</b></div>`).join('')}</div>`:'<div class="small" style="margin-top:8px">No running-cost logs yet.</div>'}</div>`}).join('')}</div>`:'<div class="empty">No vehicles.</div>'}function renderLifeEvents(){return DATA.lifeEvents.length?`<div class="list">${DATA.lifeEvents.map(e=>{const target=n(e.target_amount),saved=n(e.current_saved),pct=target?Math.min(100,saved/target*100):0;return `<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(e.name)}</div><div class="item-meta">${escapeHtml(e.priority||'Medium')} · ${e.target_date?prettyDate(e.target_date):'No date'}</div></div><b class="blue">${money(saved)}</b></div><div class="progress" style="margin-top:8px"><div style="width:${pct}%"></div></div><div class="item-meta" style="margin-top:6px">${pct.toFixed(0)}% · Target ${money(target)}</div><div class="item-actions"><button class="btn-ghost" data-action="edit-record" data-kind="life" data-id="${e.id}">Edit</button><button class="btn-danger" data-action="delete-record" data-kind="life" data-id="${e.id}">Delete</button></div></div>`}).join('')}</div>`:'<div class="empty">No life events planned.</div>'}
function renderRenewalsBills(){return `<div class="grid-2"><div><h4>Renewals</h4><div class="list">${DATA.renewals.map(r=>`<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(r.name)}</div><div class="item-meta">${escapeHtml(r.type||'Renewal')} · ${prettyDate(r.due_date)}</div></div><b>${money(r.amount)}</b></div><div class="item-actions"><button class="btn-ghost" data-action="edit-record" data-kind="renewal" data-id="${r.id}">Edit</button><button class="btn-danger" data-action="delete-record" data-kind="renewal" data-id="${r.id}">Delete</button></div></div>`).join('')||'<div class="empty">No renewals.</div>'}</div></div><div><h4>Household bills</h4><div class="list">${DATA.householdBills.map(b=>`<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(b.name)}</div><div class="item-meta">${escapeHtml(b.category||'Bill')} · Day ${b.due_day} · ${b.frequency||'Monthly'}</div></div><b>${money(b.amount)}</b></div><div class="item-actions"><button class="btn-ghost" data-action="edit-record" data-kind="bill" data-id="${b.id}">Edit</button><button class="btn-danger" data-action="delete-record" data-kind="bill" data-id="${b.id}">Delete</button></div></div>`).join('')||'<div class="empty">No household bills.</div>'}</div></div></div>`}

function updateLoanSimulator(){const box=document.querySelector('#loanSimulatorBody');if(!box)return;const loan=DATA.loans.find(x=>x.id===state.selectedLoan)||DATA.loans[0];if(!loan)return;const extra=n(document.getElementById('loanExtra')?.value);const base=loanCalc(loan,0),sim=loanCalc(loan,extra),savedMonths=Number.isFinite(base.months)&&Number.isFinite(sim.months)?Math.max(0,base.months-sim.months):0,savedInterest=Number.isFinite(base.interest)&&Number.isFinite(sim.interest)?Math.max(0,base.interest-sim.interest):0;const f=`${base.finish?prettyDate(base.finish):'Not payable'} · ${sim.finish?prettyDate(sim.finish):'Not payable'}`;box.querySelector('[data-out="payment"]').textContent=money(n(loan.emi_amount)+extra);box.querySelector('[data-out="months"]').textContent=savedMonths;box.querySelector('[data-out="interest"]').textContent=money(savedInterest);box.querySelector('[data-out="finish"]').textContent=f}
function bindView(){}
document.addEventListener('input',e=>{if(e.target.id==='loanExtra')updateLoanSimulator();});

function openModal(title,body){document.getElementById('modal').innerHTML=`<div class="modal-head"><h2>${title}</h2><button class="btn-ghost icon-btn" data-action="close-modal">×</button></div><div class="modal-body">${body}</div>`;document.getElementById('modalBackdrop').classList.add('open')}
function closeModal(){document.getElementById('modalBackdrop').classList.remove('open');document.getElementById('modal').innerHTML=''}
function modalForm(kind,id){const rec=findRecord(kind,id);const defs=FORM_DEFS[kind];const fields=defs.fields.map(f=>fieldHtml(f,rec)).join('');const title=(id?'Edit ':'Add ')+defs.title;openModal(title,`<form id="recordForm" data-kind="${kind}" data-id="${id||''}"><div class="form-grid">${fields}</div><div class="modal-actions"><button type="button" class="btn-gray" data-action="close-modal">Cancel</button><button type="submit" class="btn">Save</button></div></form>`);}
function findRecord(kind,id){const map={expense:['expenses'],income:['income'],recurringIncome:['recurringIncome'],loan:['loans'],goal:['savingsGoals'],budget:['budgets'],card:['creditCards'],asset:['assets'],investment:['investments'],oneTime:['oneTimeExpenses'],rule:['financeRules'],renewal:['renewals'],vehicle:['vehicles'],bill:['householdBills'],life:['lifeEvents']};const k=map[kind]?.[0];return id&&k?DATA[k].find(x=>x.id===id):null}
function val(rec,f,def=''){if(!rec)return def;return rec[f]??def}
function fieldHtml(f,rec){const v=val(rec,f.key,f.default??'');if(f.type==='select')return `<div class="field ${f.full?'full':''}"><label>${f.label}</label><select name="${f.key}">${f.options.map(o=>`<option value="${escapeHtml(o)}" ${String(o)===String(v)?'selected':''}>${escapeHtml(o)}</option>`).join('')}</select></div>`;if(f.type==='textarea')return `<div class="field ${f.full?'full':''}"><label>${f.label}</label><textarea name="${f.key}">${escapeHtml(v)}</textarea></div>`;return `<div class="field ${f.full?'full':''}"><label>${f.label}</label><input name="${f.key}" type="${f.type||'text'}" ${f.min!==undefined?`min="${f.min}"`:''} ${f.step?`step="${f.step}"`:''} value="${escapeHtml(v)}" ${f.required?'required':''}></div>`}

function parseQuick(t){const s=t.trim();const lower=s.toLowerCase();const amt=(s.match(/(?:₹|rs\.?|inr)?\s*([0-9][0-9,]*(?:\.\d+)?)/i)||[])[1];const amount=amt?Number(amt.replaceAll(',','')):0;let type=lower.includes('salary')||lower.includes('income')||lower.includes('received')?'income':'expense';let paid=lower.includes('paid');let name=s.replace(/(?:paid|received|salary|income|today|yesterday|tomorrow|₹|rs\.?|inr|[0-9][0-9,]*(?:\.\d+)?)/gi,' ').replace(/\s+/g,' ').trim();if(!name)name=type==='income'?'Income':'Expense';const d=new Date();if(lower.includes('yesterday'))d.setDate(d.getDate()-1);if(lower.includes('tomorrow'))d.setDate(d.getDate()+1);return{type,name,amount,date:dateKey(d),paid}}
function previewQuick(){const t=document.getElementById('quickText')?.value||'',p=parseQuick(t),el=document.getElementById('quickPreview');if(el)el.innerHTML=`<b>${escapeHtml(p.type==='income'?'Income':'Expense')}</b> · ${escapeHtml(p.name)} · <b>${money(p.amount)}</b> · ${prettyDate(p.date)} · ${p.paid?'Paid':'Pending'}`}

async function exportBackup(){const out={version:28,exportedAt:new Date().toISOString(),expenses:DATA.expenses,payments:DATA.payments,income:DATA.income,recurringIncome:DATA.recurringIncome,loans:DATA.loans,savingsGoals:DATA.savingsGoals,savingsTransactions:DATA.savingsTransactions,budgets:DATA.budgets,creditCards:DATA.creditCards,assets:DATA.assets,investments:DATA.investments,oneTimeExpenses:DATA.oneTimeExpenses,financeRules:DATA.financeRules,renewals:DATA.renewals,vehicles:DATA.vehicles,vehicleLogs:DATA.vehicleLogs,householdBills:DATA.householdBills,lifeEvents:DATA.lifeEvents,documents:DATA.documents};const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`expense-calendar-backup-${dateKey(new Date())}.json`;a.click();URL.revokeObjectURL(a.href);toast('Backup exported.','good')}
async function restoreBackupFile(file){if(!file)return toast('Choose a JSON backup file first.','bad');try{const b=JSON.parse(await file.text());if(!b.expenses&&!b.income&&!b.loans&&!b.savingsGoals&&!b.oneTimeExpenses&&!b.assets&&!b.investments)throw Error('This does not look like an Expense Calendar backup.');const expenseMap={},goalMap={},vehicleMap={};for(const x of (b.expenses||[])){const d=await dbInsert('expenses',{name:x.name,amount:n(x.amount),frequency:x.frequency||'Monthly',due_day:n(x.due_day)||1,start_month:x.start_month||monthKey(new Date()),category:x.category||'Other'});expenseMap[x.id]=d.id}for(const x of (b.payments||[])){const eid=expenseMap[x.expense_id]||x.expense_id;if(eid)try{await dbInsert('payment_status',{expense_id:eid,payment_date:x.payment_date,paid:!!x.paid})}catch(e){console.warn('payment restore',e.message)}}for(const x of (b.income||[]))await dbInsert('income',{name:x.name,amount:n(x.amount),income_date:x.income_date||dateKey(new Date())});for(const x of (b.recurringIncome||b.recurring_income||[]))await dbInsert('recurring_income',{name:x.name,amount:n(x.amount),frequency:x.frequency||'Monthly',start_date:x.start_date||dateKey(new Date()),end_date:x.end_date||null});for(const x of (b.loans||[]))await dbInsert('loans',{name:x.name,lender:x.lender||null,original_amount:n(x.original_amount),outstanding_amount:n(x.outstanding_amount),interest_rate:n(x.interest_rate),emi_amount:n(x.emi_amount),start_date:x.start_date||dateKey(new Date()),tenure_months:n(x.tenure_months)||1});for(const x of (b.savingsGoals||b.savings_goals||[])){const d=await dbInsert('savings_goals',{name:x.name,target_amount:n(x.target_amount),current_amount:n(x.current_amount),target_date:x.target_date||null});goalMap[x.id]=d.id}for(const x of (b.savingsTransactions||b.savings_transactions||[])){const gid=goalMap[x.goal_id]||x.goal_id;if(gid)await dbInsert('savings_transactions',{goal_id:gid,amount:n(x.amount),transaction_date:x.transaction_date||dateKey(new Date()),note:x.note||null})}for(const x of (b.budgets||[]))await dbUpsert('budgets',{category:x.category,monthly_limit:n(x.monthly_limit)},'user_id,category');for(const x of (b.creditCards||b.credit_cards||[]))await dbInsert('credit_cards',{name:x.name,bank:x.bank||null,credit_limit:n(x.credit_limit),current_used:n(x.current_used),billing_day:n(x.billing_day)||1,due_day:n(x.due_day)||15});for(const x of (b.assets||[]))await dbInsert('assets',{name:x.name,category:x.category||'Other',current_value:n(x.current_value),notes:x.notes||null});for(const x of (b.investments||[]))await dbInsert('investments',{name:x.name,type:x.type||'Other',invested_amount:n(x.invested_amount),current_value:n(x.current_value),investment_date:x.investment_date||dateKey(new Date()),notes:x.notes||null});for(const x of (b.oneTimeExpenses||b.one_time_expenses||[]))await dbInsert('one_time_expenses',{name:x.name,amount:n(x.amount),expense_date:x.expense_date||dateKey(new Date()),category:x.category||'Other',note:x.note||x.notes||null});for(const x of (b.financeRules||b.finance_rules||[]))await dbInsert('finance_rules',{name:x.name||'Smart rule',rule_type:x.rule_type||'monthly_threshold',category:x.category||'Other',threshold:n(x.threshold),enabled:x.enabled!==false});for(const x of (b.renewals||[]))await dbInsert('renewals',{name:x.name,due_date:x.due_date||dateKey(new Date()),amount:n(x.amount),type:x.type||'Other',reminder_days:n(x.reminder_days)||14,notes:x.notes||null});for(const x of (b.vehicles||[])){const d=await dbInsert('vehicles',{name:x.name,type:x.type||x.vehicle_type||'Other',purchase_date:x.purchase_date||null,current_value:n(x.current_value),insurance_date:x.insurance_date||null,notes:x.notes||null});vehicleMap[x.id]=d.id}for(const x of (b.vehicleLogs||b.vehicle_logs||[])){const vid=vehicleMap[x.vehicle_id]||x.vehicle_id;if(vid)await dbInsert('vehicle_logs',{vehicle_id:vid,log_date:x.log_date||dateKey(new Date()),log_type:x.log_type||'Expense',amount:n(x.amount),odometer:n(x.odometer),note:x.note||x.notes||null})}for(const x of (b.householdBills||b.household_bills||[]))await dbInsert('household_bills',{name:x.name,amount:n(x.amount),frequency:x.frequency||'Monthly',due_day:n(x.due_day)||1,category:x.category||'Household',start_month:x.start_month||monthKey(new Date()),notes:x.notes||null});for(const x of (b.lifeEvents||b.life_events||[]))await dbInsert('life_events',{name:x.name,target_date:x.target_date||null,target_amount:n(x.target_amount),current_saved:n(x.current_saved),priority:x.priority||'Medium',notes:x.notes||null});for(const x of (b.documents||[])){if(state.sample)DATA.documents.push({...x,id:'doc'+Date.now()+Math.random().toString(36).slice(2,5)});else await dbInsert('finance_documents',{name:x.name,document_type:x.document_type||x.type||'Other',file_url:x.file_url||x.url||null,notes:x.notes||null})}if(!state.sample)await loadData();closeModal();render();toast('Backup restored successfully.','good')}catch(e){console.error(e);toast('Restore failed: '+e.message,'bad')}}

async function saveRecord(kind,id,form){const defs=FORM_DEFS[kind],fd=new FormData(form),raw={};defs.fields.forEach(f=>{let v=fd.get(f.key);if(f.type==='number')v=n(v);if(f.type==='select'&&f.key==='enabled')v=v==='true';raw[f.key]=v});if(kind==='expense'){raw.due_day=n(raw.due_day)||1;raw.start_month=raw.start_month||monthKey(new Date())}if(kind==='recurringIncome')raw.end_date=raw.end_date||null;if(kind==='loan'){raw.original_amount=n(raw.original_amount);raw.outstanding_amount=n(raw.outstanding_amount);raw.interest_rate=n(raw.interest_rate);raw.emi_amount=n(raw.emi_amount);raw.tenure_months=n(raw.tenure_months)||1}if(kind==='goal'){raw.target_amount=n(raw.target_amount);raw.current_amount=n(raw.current_amount)}if(kind==='budget'){raw.monthly_limit=n(raw.monthly_limit);if(id){const out=await dbUpdate('budgets',id,raw);if(!state.sample){const i=DATA.budgets.findIndex(x=>x.id===id);if(i>=0)DATA.budgets[i]=out}}else{const out=await dbUpsert('budgets',raw,'user_id,category');if(!state.sample){const i=DATA.budgets.findIndex(x=>x.category===raw.category);if(i>=0)DATA.budgets[i]=out;else DATA.budgets.push(out)}}closeModal();render();toast('Saved.','good');return}if(kind==='rule'){raw.threshold=n(raw.threshold);raw.enabled=raw.enabled!==false}const table=defs.table;const out=id?await dbUpdate(table,id,raw):await dbInsert(table,raw);if(id){const key=TABLE_KEYS[table];if(!state.sample){const i=DATA[key].findIndex(x=>x.id===id);if(i>=0)DATA[key][i]=out}}else if(!state.sample)DATA[TABLE_KEYS[table]].push(out);closeModal();render();toast('Saved.','good')}
async function deleteRecord(kind,id){if(!confirm('Delete this record?'))return;const table=FORM_DEFS[kind]?.table;if(!table)return;await dbDelete(table,id);const key=TABLE_KEYS[table];DATA[key]=DATA[key].filter(x=>x.id!==id);render();toast('Deleted.','good')}
async function addGoalSaving(id){const g=DATA.savingsGoals.find(x=>x.id===id);if(!g)return;const amount=Number(prompt('Saving amount:',1000));if(!amount)return;await dbInsert('savings_transactions',{goal_id:id,amount,transaction_date:dateKey(new Date()),note:'Goal saving'});g.current_amount=n(g.current_amount)+amount;if(!state.sample)await dbUpdate('savings_goals',id,{current_amount:g.current_amount});render();toast('Goal updated.','good')}
function togglePaid(id,date){const d=new Date(date+'T00:00:00'),found=DATA.payments.find(x=>x.expense_id===id&&String(x.payment_date).slice(0,10)===date);const paid=found?!found.paid:true;if(state.sample){if(found)found.paid=paid;else DATA.payments.push({id:'p'+Date.now(),expense_id:id,payment_date:date,paid});render();return}if(found){dbUpdate('payment_status',found.id,{paid}).then(()=>{found.paid=paid;render()}).catch(e=>toast(e.message,'bad'))}else dbInsert('payment_status',{expense_id:id,payment_date:date,paid}).then(x=>{DATA.payments.push(x);render()}).catch(e=>toast(e.message,'bad'))}
function loanHistory(kind,id){const obj=kind==='expense'?DATA.expenses.find(x=>x.id===id):DATA.loans.find(x=>x.id===id);if(!obj)return;const rows=[];for(let i=0;i<12;i++){const m=addMonths(startMonth(new Date()),-i);const d=kind==='expense'?dueOn(obj,m):new Date(m.getFullYear(),m.getMonth(),Math.min(28,n(new Date(obj.start_date||dateKey(m)).getDate())||1));if(d<new Date((obj.start_month||obj.start_date||'1900-01-01')+'T00:00:00'))continue;rows.push({month:monthLabel(m),date:prettyDate(d),amount:kind==='expense'?obj.amount:obj.emi_amount,paid:kind==='expense'?getPaid(obj.id,d):false})}openModal('Payment history',`<div class="table-wrap"><table class="table"><thead><tr><th>Month</th><th>Due</th><th>Amount</th><th>Status</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.month}</td><td>${r.date}</td><td>${money(r.amount)}</td><td>${r.paid?'Paid':'Pending'}</td></tr>`).join('')}</tbody></table></div>`)}

 if(action==='tab')return setActiveTab(b.dataset.tab); if(action==='sub')return setSub(b.dataset.sub); if(action==='tab-calendar')return setActiveTab('calendar'); if(action==='tab-planning')return setActiveTab('planning'); if(action==='tab-money')return setActiveTab('money');
 if(action==='add-entry')return addEntryChooser(); if(action==='quick-add')return quickAdd(); if(action==='alerts')return showAlerts(); if(action==='more'){e.stopPropagation();return moreMenu()} if(action==='logout')return logout(); if(action==='install')return installApp();
 if(action==='close-modal')return closeModal(); if(action==='account') {closeMore();return accountModal()} if(action==='appearance'){closeMore();return appearanceModal()} if(action==='privacy'){closeMore();state.privacy=!state.privacy;localStorage.setItem('expense-calendar-privacy',state.privacy?'1':'0');toast(`Privacy mode ${state.privacy?'enabled':'disabled'}.`);render();return} if(action==='alerts-settings'){closeMore();return notificationSettings()} if(action==='backup'){closeMore();return exportBackup()} if(action==='restore'){closeMore();return restoreModal()} if(action==='refresh'){closeMore();await loadData();render();return toast('Data refreshed.','good')}

 if(action==='prev-month'){state.month=addMonths(state.month,-1);return render()} if(action==='next-month'){state.month=addMonths(state.month,1);return render()} if(action==='today-month'){state.month=startMonth(new Date());return render()} if(action==='cal-filter'){state.calendarFilter=b.dataset.filter;return render()}
 if(action==='money-filter'){state.moneyFilter=b.dataset.filter;return render()} if(action==='select-loan'){state.selectedLoan=b.dataset.id;return render()} if(action==='loan-sim-refresh')return render(); if(action==='history')return loanHistory(b.dataset.kind,b.dataset.id); if(action==='toggle-skip')return toggleSchedule(b.dataset.kind,b.dataset.id,startMonth(new Date()),'skip'); if(action==='toggle-pause')return toggleSchedule(b.dataset.kind,b.dataset.id,startMonth(new Date()),'pause');
 if(action==='create-household')return createHousehold(); if(action==='invite-household')return inviteHousehold(); if(action==='add-record'&&b.dataset.kind==='shared')return sharedExpenseModal(); if(action==='add-record')return modalForm(b.dataset.kind); if(action==='edit-record')return modalForm(b.dataset.kind,b.dataset.id); if(action==='delete-record')return deleteRecord(b.dataset.kind,b.dataset.id); if(action==='delete-vehicle-log')return deleteVehicleLog(b.dataset.id); if(action==='goal-add')return addGoalSaving(b.dataset.id); if(action==='toggle-paid')return togglePaid(b.dataset.id,b.dataset.date); if(action==='toggle-one-paid'){setOneTimePaid(b.dataset.id,new Date(b.dataset.date+'T00:00:00'),!getOneTimePaid(b.dataset.id,new Date(b.dataset.date+'T00:00:00')));return render()} if(action==='vehicle-log')return modalVehicleLog(b.dataset.id);

 }catch(err){console.error(err);toast(err.message||'Action failed.','bad')}}

document.getElementById('recordForm')?.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('submit',e=>{if(e.target.id==='recordForm'){e.preventDefault();saveRecord(e.target.dataset.kind,e.target.dataset.id||'',e.target)}});
function renderSearch(){const q=state.search.toLowerCase();const hits=[];const sets=[['Expense',DATA.expenses],['Income',DATA.income],['Recurring income',DATA.recurringIncome],['Loan',DATA.loans],['Goal',DATA.savingsGoals],['Card',DATA.creditCards],['Asset',DATA.assets],['Investment',DATA.investments],['Renewal',DATA.renewals],['Vehicle',DATA.vehicles],['Bill',DATA.householdBills],['Life event',DATA.lifeEvents]];sets.forEach(([type,rows])=>rows.forEach(x=>{const s=JSON.stringify(x).toLowerCase();if(s.includes(q))hits.push({type,name:x.name||x.description||type,raw:x})}));document.getElementById('main').innerHTML=`<section class="panel"><div class="panel-head"><div><h2>Search</h2><div class="muted">Results across your financial data.</div></div></div><div class="list">${hits.slice(0,40).map(h=>`<div class="item"><div class="item-head"><div><div class="item-title">${escapeHtml(h.name)}</div><div class="item-meta">${h.type}</div></div></div></div>`).join('')||'<div class="empty">No matches.</div>'}</div></section>`}
async function createHousehold(){if(state.sample){DATA.sharedHouseholds.push({id:'sh1',owner_id:state.currentUser.id,name:'Sample Family'});render();return toast('Sample household created.','good')}if(!supabaseClient)return;const name=prompt('Household name:','Family');if(!name)return;try{const {error}=await supabaseClient.rpc('create_shared_household',{p_name:name});if(error)throw error;await loadData();render();toast('Household created.','good')}catch(e){toast(e.message,'bad')}}
async function inviteHousehold(){if(state.sample)return toast('Sample mode does not send invites.','info');const h=DATA.sharedHouseholds[0];if(!h)return toast('Create a household first.','bad');const email=prompt('Member email:');if(!email)return;try{const {error}=await supabaseClient.rpc('add_shared_member',{p_household_id:h.id,p_email:email});if(error)throw error;toast('Invitation sent.','good')}catch(e){toast(e.message,'bad')}}
function sharedExpenseModal(){const h=DATA.sharedHouseholds[0];if(!h&&!state.sample)return toast('Create a household first.','bad');openModal('＋ Shared expense',`<form id="sharedExpenseForm"><div class="form-grid"><div class="field"><label>Description</label><input name="name" required></div><div class="field"><label>Amount</label><input name="amount" type="number" min="0" step="0.01" required></div><div class="field"><label>Date</label><input name="expense_date" type="date" value="${dateKey(new Date())}" required></div></div><div class="modal-actions"><button type="button" class="btn-gray" data-action="close-modal">Cancel</button><button class="btn" type="submit">Save</button></div></form>`)}
async function deleteVehicleLog(id){if(!confirm('Delete this vehicle log?'))return;if(state.sample){DATA.vehicleLogs=DATA.vehicleLogs.filter(x=>x.id!==id);render();return}try{await dbDelete('vehicle_logs',id);DATA.vehicleLogs=DATA.vehicleLogs.filter(x=>x.id!==id);render();toast('Vehicle log deleted.','good')}catch(e){toast(e.message,'bad')}}
function modalVehicleLog(vehicleId){const v=DATA.vehicles.find(x=>x.id===vehicleId);openModal('＋ Vehicle cost',`<form id="vehicleLogForm" data-vehicle="${vehicleId}"><div class="form-grid"><div class="field"><label>Vehicle</label><input value="${escapeHtml(v?.name||'')}" disabled></div><div class="field"><label>Date</label><input name="log_date" type="date" value="${dateKey(new Date())}"></div><div class="field"><label>Type</label><select name="log_type"><option>Charging</option><option>Fuel</option><option>Service</option><option>Insurance</option><option>Expense</option></select></div><div class="field"><label>Amount</label><input name="amount" type="number" min="0" step="0.01"></div><div class="field"><label>Odometer</label><input name="odometer" type="number" min="0"></div><div class="field full"><label>Note</label><textarea name="note"></textarea></div></div><div class="modal-actions"><button type="button" class="btn-gray" data-action="close-modal">Cancel</button><button class="btn" type="submit">Save</button></div></form>`)}
document.addEventListener('submit',async e=>{if(e.target.id==='vehicleLogForm'){e.preventDefault();const fd=new FormData(e.target);const row={vehicle_id:e.target.dataset.vehicle,log_date:fd.get('log_date'),log_type:fd.get('log_type'),amount:n(fd.get('amount')),odometer:n(fd.get('odometer')),note:fd.get('note')||null};try{const x=await dbInsert('vehicle_logs',row);DATA.vehicleLogs.push(x);closeModal();render();toast('Vehicle log added.','good')}catch(err){toast(err.message,'bad')}}});

document.addEventListener('submit',async e=>{if(e.target.id==='sharedExpenseForm'){e.preventDefault();const fd=new FormData(e.target);try{if(state.sample){DATA.sharedExpenses.push({id:'sx'+Date.now(),name:fd.get('name'),amount:n(fd.get('amount')),expense_date:fd.get('expense_date'),household_id:DATA.sharedHouseholds[0]?.id||'sh1'});}else{await dbInsert('shared_expenses',{household_id:DATA.sharedHouseholds[0]?.id,name:fd.get('name'),amount:n(fd.get('amount')),expense_date:fd.get('expense_date')})}closeModal();render();toast('Shared expense added.','good')}catch(err){toast(err.message,'bad')}}});
function installHook(){let deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('installButton').style.display='inline-flex'});window.installApp=async()=>{if(!deferred)return toast('Install is not available yet. Use the browser menu to install this app.','info');deferred.prompt();await deferred.userChoice;deferred=null}}
async function boot(){initPrefs();installHook();if(state.sample){applySample();showApp();return}try{if(!supabaseClient)throw Error('Supabase client unavailable.');const {data:{session}}=await supabaseClient.auth.getSession();if(session){state.currentUser=session.user;await loadData();showApp()}else showAuth();supabaseClient.auth.onAuthStateChange(async(event,session)=>{if(session){state.currentUser=session.user;try{await loadData();showApp()}catch(e){authMsg(e.message,true)}}else showAuth()})}catch(e){authMsg(e.message,true);showAuth()}}
boot();
</script>
</body>
</html>
