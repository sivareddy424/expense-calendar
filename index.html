function parseQuickMessage(message){const s=message.toLowerCase();const amountMatch=message.replace(/,/g,'').match(/(?:₹\s*)?(\d+(?:\.\d{1,2})?)/);if(!amountMatch)return null;const amount=Number(amountMatch[1]);if(!amount||!Number.isFinite(amount))return null;let name=message.replace(/(?:₹\s*)?\d[\d,]*(?:\.\d{1,2})?/,'').replace(/\b(paid|pay|spent|spend|bought|purchase|today|yesterday|received|salary|income|invested|investment|in|on|for|rupees|rs)\b/ig,' ').replace(/\s+/g,' ').trim().replace(/[.,]$/,'');if(!name)name='Quick entry';const paid=/\bpaid\b/i.test(s);if(/invest(ed|ment)|mutual fund|stocks|shares|gold bond/.test(s))return {kind:'investments',paid:false,fields:{name:name||'Investment',type:/mutual fund/.test(s)?'Mutual Fund':'Other',invested_amount:amount,current_value:amount,investment_date:todayIso(),notes:message}};if(/\bsalary\b/.test(s)||/\breceived\b/.test(s))return {kind:'income',paid:false,fields:{name:/salary/.test(s)?'Salary':name,amount,income_date:todayIso()}};return {kind:'oneTimeExpenses',paid,fields:{name:name||'Expense',amount,expense_date:todayIso(),category:/electric|water|internet|gas|utility/.test(s)?'Utilities':/loan|emi/.test(s)?'Loan / EMI':/food|grocery|grocer/.test(s)?'Food':'Other',note:message}};}
function isDueExpense(e,d){const start=String(e.start_month||'');const diff=(d.getFullYear()-Number(start.slice(0,4)))*12+(d.getMonth()+1-Number(start.slice(5,7)));return !!start&&diff>=0&&diff%freqMonths(e.frequency)===0;}
function universalKey(e){return `${e.kind}|${e.id}|${e.date}`;}
function paidState(e){if(e.kind==='expenses'){const p=state.payments.find(x=>x.expense_id===e.id&&String(x.payment_date).slice(0,10)===e.date);if(p)return !!p.paid;}return !!state.universalPaidState[universalKey(e)];}

 state.expenses.filter(x=>isDueExpense(x,month)).forEach(x=>add('expenses','Recurring expense',x,dayInMonth(y,m,x.due_day),x.amount,x.category));
 state.recurringIncome.forEach(x=>{const st=parseDate(x.start_date);if(!st||st>last||(x.end_date&&parseDate(x.end_date)<first))return;const diff=monthDiff(startOfMonth(st),first);if(diff<0||diff%freqMonths(x.frequency)!==0)return;add('recurringIncome','Recurring income',x,dayInMonth(y,m,st.getDate()),x.amount,'Income','income');});

 state.loans.forEach(x=>{const st=parseDate(x.start_date);if(!st||st>last||num(x.outstanding_amount)<=0)return;add('loans','Loan EMI',x,dayInMonth(y,m,st.getDate()),x.emi_amount,'Loan / EMI');});

 state.savingsTransactions.filter(x=>{const d=parseDate(x.transaction_date);return d&&d>=first&&d<=last;}).forEach(x=>add('savingsTransactions','Savings contribution',x,parseDate(x.transaction_date),x.amount,'Savings'));

function monthStats(month=currentDate){const events=eventsForMonth(month),income=events.filter(e=>e.type==='income').reduce((s,e)=>s+e.amount,0),expenses=events.filter(e=>e.type!=='income').reduce((s,e)=>s+e.amount,0),paid=events.filter(e=>e.type!=='income'&&e.paid).reduce((s,e)=>s+e.amount,0);return {events,income,expenses,net:income-expenses,paid,pending:expenses-paid};}
async function markPaid(event,paid){if(!currentUser)return;if(IS_DEMO){if(event.kind==='expenses'){let p=state.payments.find(x=>x.expense_id===event.id&&x.payment_date===event.date);if(p)p.paid=paid;else state.payments.push({id:'demo-pay-'+Date.now(),expense_id:event.id,payment_date:event.date,paid});}else state.universalPaidState[universalKey(event)]=paid;renderAll();showToast(paid?'Marked paid':'Marked pending');return;}

function renderCalendar(){const y=currentDate.getFullYear(),m=currentDate.getMonth(),first=new Date(y,m,1),offset=first.getDay(),days=new Date(y,m+1,0).getDate(),s=monthStats(currentDate),filter=$('#calendarFilter')?.value||'all';let cells='';for(let i=0;i<offset;i++)cells+='<div class="day" style="visibility:hidden"></div>';for(let d=1;d<=days;d++){const dt=dayInMonth(y,m,d),ds=isoDate(dt),events=s.events.filter(e=>e.date===ds).filter(e=>filter==='all'||(filter==='income'?e.type==='income':filter==='expense'?e.type!=='income':filter==='paid'?e.paid:!e.paid));cells+=`<button class="day ${ds===isoDate(selectedDate)?'selected':''} ${ds===todayIso()?'today':''}" data-day="${ds}" type="button"><div class="day-num">${d}</div><div class="day-events">${events.slice(0,2).map(e=>`<div class="day-event ${e.type==='income'?'':'exp'} ${e.paid?'paid':''}">${esc(e.name)} · ${money(e.amount)}</div>`).join('')}${events.length>2?`<div class="day-event">+${events.length-2} more</div>`:''}</div></button>`;}

function simulatePortfolio(extra=0,anchor=currentDate){const active=state.loans.filter(l=>num(l.outstanding_amount)>0).map(l=>({id:l.id,name:l.name||'Loan',balance:num(l.outstanding_amount),rate:Math.max(0,num(l.interest_rate))/1200,emi:Math.max(0,num(l.emi_amount)),interest:0}));if(!active.length)return {months:0,interest:0,totalPaid:0,finish:anchor};const baseBudget=active.reduce((s,l)=>s+l.emi,0)+Math.max(0,num(extra));if(baseBudget<=0)return {months:Infinity,interest:Infinity,totalPaid:Infinity,finish:null};let month=0,interestTotal=0,paidTotal=0;while(active.some(l=>l.balance>0.01)&&month<720){month++;let thisInterest=0;active.forEach(l=>{if(l.balance>0.01){const interest=l.balance*l.rate;l.balance+=interest;l.interest+=interest;thisInterest+=interest;}});interestTotal+=thisInterest;let spent=0;for(const l of active){if(l.balance<=.01)continue;const payment=Math.min(l.balance,l.emi);l.balance=Math.max(0,l.balance-payment);spent+=payment;}let pool=Math.max(0,baseBudget-spent);const ordered=active.filter(l=>l.balance>.01).sort((a,b)=>b.rate-a.rate||b.balance-a.balance);for(const l of ordered){if(pool<=.005)break;const pay=Math.min(pool,l.balance);l.balance=Math.max(0,l.balance-pay);pool-=pay;spent+=pay;}paidTotal+=spent;}if(month>=720&&active.some(l=>l.balance>.01))return {months:Infinity,interest:Infinity,totalPaid:Infinity,finish:null};const finish=new Date(anchor.getFullYear(),anchor.getMonth()+month,1);return {months:month,interest:interestTotal,totalPaid:paidTotal,finish};}
function finishMonth(result){if(!result||!Number.isFinite(result.months))return 'Not amortizing';if(result.months===0)return 'Already paid';return result.finish.toLocaleDateString('en-IN',{month:'short',year:'numeric'});}
let loanExtra=0;
function renderLoanIntelligence(){const base=simulatePortfolio(0,currentDate),extra=simulatePortfolio(loanExtra,currentDate),saved=Number.isFinite(base.months)&&Number.isFinite(extra.months)?Math.max(0,base.months-extra.months):0,intSaved=Number.isFinite(base.interest)&&Number.isFinite(extra.interest)?Math.max(0,base.interest-extra.interest):0;const target=$('#loanPayoffResults');if(!target)return;const anchor=monthName(currentDate);target.innerHTML=`<div class="loan-result-grid"><div class="loan-result"><small>Current payoff</small><b>${finishMonth(base)}</b><div class="small muted">${Number.isFinite(base.months)?base.months+' months':'EMI may be too low'}</div></div><div class="loan-result"><small>With extra ${money(loanExtra)}/mo</small><b>${finishMonth(extra)}</b><div class="small muted">${Number.isFinite(extra.months)?extra.months+' months':'Not amortizing'}</div></div><div class="loan-result"><small>Time saved</small><b class="green">${saved?saved+' months':'—'}</b><div class="small muted">Across all loans</div></div><div class="loan-result"><small>Interest saved</small><b class="green">${intSaved?money(intSaved):'—'}</b><div class="small muted">Estimated</div></div></div><div class="grid two-col"><div><div class="kpi-label">Estimated interest with normal EMIs</div><div class="kpi-value">${Number.isFinite(base.interest)?money(base.interest):'—'}</div></div><div><div class="kpi-label">Estimated interest in extra-payment plan</div><div class="kpi-value">${Number.isFinite(extra.interest)?money(extra.interest):'—'}</div></div></div><div class="notice">Estimate starts from ${esc(anchor)} and assumes rates and EMI amounts remain unchanged. Extra money is applied after the regular EMIs to the highest-interest outstanding loan; surplus payment is reused after a loan closes. This is a scenario only—it does not modify loan records or your selected calendar month.</div>`;}
function renderLoans(){const total=state.loans.reduce((s,l)=>s+num(l.outstanding_amount),0),emi=state.loans.reduce((s,l)=>s+num(l.emi_amount),0);return `<div class="panel">${sectionHead('Loans','Outstanding balance, EMIs and payoff scenarios in one place.',`<button class="btn btn-primary" data-entry-open="loans">＋ Loan</button>`)}<div class="grid three-col">${kpi('Outstanding debt',money(total),'Current balances','red')}${kpi('Monthly EMIs',money(emi),'Scheduled EMI total')}${kpi('Loans',state.loans.length,'Tracked accounts')}</div><div class="list">${state.loans.map(l=>{const orig=num(l.original_amount),paid=Math.max(0,orig-num(l.outstanding_amount)),pct=orig?Math.min(100,paid/orig*100):0;return `<div class="card"><div class="status-row"><div><b>${esc(l.name)}</b><div class="item-meta">${esc(l.lender||'')} · ${num(l.interest_rate).toFixed(2)}% annual interest</div></div><b class="red">${money(l.outstanding_amount)}</b></div><div class="grid two-col" style="margin-top:12px"><div><div class="muted small">Monthly EMI</div><b>${money(l.emi_amount)}</b></div><div><div class="muted small">Original amount</div><b>${money(l.original_amount)}</b></div></div><div class="progress" style="margin-top:12px"><span style="width:${pct}%"></span></div><div class="item-meta">${pct.toFixed(1)}% principal repaid</div><div class="item-actions"><button class="btn btn-quiet" data-edit="loans" data-id="${esc(l.id)}">Edit loan</button><button class="btn btn-quiet" data-balance="${esc(l.id)}">Update balance</button><button class="btn btn-quiet" data-delete="loans" data-id="${esc(l.id)}">Delete</button></div></div>`;}).join('')||'<div class="empty"><strong>No loans added yet</strong>Add a Loan / EMI to enable payoff intelligence.</div>'}</div></div><div class="panel"><div class="section-head"><div><h2>Loan Payoff Intelligence</h2><p>One canonical calculator. Increasing the extra payment updates only these calculations.</p></div><div class="field" style="min-width:180px;margin:0"><label for="loanExtraInput">Extra amount per month (₹)</label><input id="loanExtraInput" type="number" min="0" step="500" value="${loanExtra}"></div></div><div id="loanPayoffResults"></div></div>`;}
function renderGoals(){const total=state.savingsGoals.reduce((s,g)=>s+num(g.target_amount),0),saved=state.savingsGoals.reduce((s,g)=>s+num(g.current_amount),0);return `<div class="panel">${sectionHead('Savings goals','Track targets, contributions and the monthly amount needed.',`<button class="btn btn-primary" data-entry-open="savingsGoals">＋ Goal</button>`)}<div class="grid three-col">${kpi('Total targets',money(total),'All goals')}${kpi('Saved so far',money(saved),'Current progress','green')}${kpi('Remaining',money(Math.max(0,total-saved)),'To reach targets')}</div><div class="list">${state.savingsGoals.map(g=>{const t=num(g.target_amount),c=num(g.current_amount),pct=t?Math.min(100,c/t*100):0,rem=Math.max(0,t-c);let req=0;if(g.target_date){const d=parseDate(g.target_date),months=d?Math.max(1,monthDiff(startOfMonth(currentDate),startOfMonth(d))+1):1;req=rem/months;}return `<div class="card"><div class="status-row"><div><b>${esc(g.name)}</b><div class="item-meta">Target ${g.target_date?dateLabel(g.target_date):'No date'}</div></div><b>${pct.toFixed(0)}%</b></div><div style="display:flex;justify-content:space-between;gap:8px;margin:10px 0 7px;font-size:12px"><span>${money(c)} saved</span><span>${money(t)} target</span></div><div class="progress"><span style="width:${pct}%"></span></div><div class="grid two-col" style="margin-top:12px"><div><div class="muted small">Still needed</div><b>${money(rem)}</b></div><div><div class="muted small">Needed per month</div><b>${g.target_date?money(req):'Set a target date'}</b></div></div><div class="item-actions"><button class="btn btn-primary" data-contribute="${esc(g.id)}">＋ Add savings</button><button class="btn btn-quiet" data-edit="savingsGoals" data-id="${esc(g.id)}">Edit</button><button class="btn btn-quiet" data-delete="savingsGoals" data-id="${esc(g.id)}">Delete</button></div></div>`;}).join('')||'<div class="empty"><strong>No goals yet</strong>Add a target to create a savings plan.</div>'}</div></div>`;}
function renderForecast(){const s=monthStats(currentDate),target=state.savingsGoals.reduce((z,g)=>z+Math.max(0,num(g.target_amount)-num(g.current_amount)),0);return `<div class="panel">${sectionHead('Forecast','A straightforward projection based on this month’s planned income and outflow.')}<div class="grid three-col">${kpi('Current monthly net',money(s.net),'Income less tracked outflow',s.net>=0?'green':'red')}${kpi('12-month net at same pace',money(s.net*12),'Assumes values stay unchanged',s.net>=0?'green':'red')}${kpi('Remaining goal funding',money(target),'All savings goals')}</div><h3>Next 12 months · estimated surplus</h3><div class="chart">${Array.from({length:12},(_,i)=>{const d=new Date(currentDate.getFullYear(),currentDate.getMonth()+i,1);const ms=monthStats(d),max=Math.max(1,...Array.from({length:12},(_,j)=>Math.abs(monthStats(new Date(currentDate.getFullYear(),currentDate.getMonth()+j,1)).net)));return `<div class="bar-col"><span class="bar-value">${Math.round(ms.net/1000)}k</span><div class="bar" style="height:${Math.max(3,Math.abs(ms.net)/max*125)}px;background:${ms.net>=0?'linear-gradient(180deg,#5fd4a0,#15965a)':'linear-gradient(180deg,#ff9393,#dc3636)'}"></div><span class="bar-label">${d.toLocaleDateString('en-IN',{month:'short'})}</span></div>`;}).join('')}</div><div class="notice">Forecast repeats the current recurring schedules and existing one-time records only in their recorded dates. It is an estimate, not a prediction of future unrecorded purchases or income.</div></div>`;}
function renderBudgets(){const cats=new Set([...state.budgets.map(b=>b.category),...monthStats(currentDate).events.filter(e=>e.type!=='income').map(e=>e.category)]),ev=monthStats(currentDate).events;return `<div class="panel">${sectionHead('Budgets','See category spending against its monthly limit.',`<button class="btn btn-primary" data-entry-open="budgets">＋ Budget</button>`)}<div class="list">${[...cats].map(c=>{const b=state.budgets.find(x=>x.category===c),spent=ev.filter(e=>e.type!=='income'&&e.category===c).reduce((s,e)=>s+e.amount,0),limit=num(b?.monthly_limit),pct=limit?Math.min(100,spent/limit*100):0,over=limit>0&&spent>limit;return `<div class="card"><div class="status-row"><div><b>${esc(c)}</b><div class="item-meta">${limit?`${money(spent)} spent of ${money(limit)}`:`${money(spent)} spent · no budget set`}</div></div>${b?`<button class="btn btn-quiet" data-edit="budgets" data-id="${esc(b.id)}">Edit</button>`:`<button class="btn btn-quiet" data-new-budget="${esc(c)}">Set limit</button>`}</div>${limit?`<div class="progress" style="margin-top:10px"><span style="width:${pct}%;background:${over?'var(--red)':pct>=80?'var(--amber)':'var(--blue)'}"></span></div><div class="item-meta">${over?`Over budget by ${money(spent-limit)}`:`${money(Math.max(0,limit-spent))} remaining`} · ${Math.round(spent/limit*100)}%</div>`:''}</div>`;}).join('')||'<div class="empty">Add a budget to see category usage.</div>'}</div></div>`;}
function renderWhatIf(){const s=monthStats(currentDate);return `<div class="panel">${sectionHead('What-if simulator','Change assumptions to see a scenario. It does not edit any records.')}<div class="form-grid"><div class="field"><label>Monthly income change (₹)</label><input id="whatIncome" type="number" step="500" value="0"></div><div class="field"><label>Monthly expense change (₹)</label><input id="whatExpense" type="number" step="500" value="0"></div><div class="field"><label>Extra EMI obligation (₹)</label><input id="whatEmi" type="number" step="500" min="0" value="0"></div><div class="field"><label>Extra savings target (₹)</label><input id="whatSave" type="number" step="500" min="0" value="0"></div></div><div id="whatIfResults" class="grid three-col" style="margin-top:15px"></div><div class="form-footer"><button class="btn btn-quiet" id="resetWhatIf">Reset scenario</button></div></div>`;}
function wireWhatIf(){const calc=()=>{const base=monthStats(currentDate).net,net=base+num($('#whatIncome')?.value)-num($('#whatExpense')?.value)-num($('#whatEmi')?.value)-num($('#whatSave')?.value);$('#whatIfResults').innerHTML=kpi('Current net',money(base),'Based on tracked data',base>=0?'green':'red')+kpi('Scenario net',money(net),'After changes',net>=0?'green':'red')+kpi('Annual difference',money((net-base)*12),'12× monthly change',(net>=base)?'green':'red');};['#whatIncome','#whatExpense','#whatEmi','#whatSave'].forEach(s=>$(s)?.addEventListener('input',calc));$('#resetWhatIf').onclick=()=>{['#whatIncome','#whatExpense','#whatEmi','#whatSave'].forEach(s=>$(s).value=0);calc();};calc();}
function renderPlanning(){const items=[['loans','Loans'],['goals','Goals'],['forecast','Forecast'],['budgets','Budgets'],['whatif','What-if']];const fn={loans:renderLoans,goals:renderGoals,forecast:renderForecast,budgets:renderBudgets,whatif:renderWhatIf};const sub=subs.planning||'loans';$('#view-planning').innerHTML=subNav('planning',items.map(x=>[x[0],x[1]]))+`<div id="planningContent">${(fn[sub]||renderLoans)()}</div>`;if(sub==='loans'){renderLoanIntelligence();$('#loanExtraInput').oninput=e=>{loanExtra=Math.max(0,num(e.target.value));renderLoanIntelligence();};}if(sub==='whatif')wireWhatIf();}
function renderReports(){const s12=Array.from({length:12},(_,i)=>new Date(currentDate.getFullYear(),currentDate.getMonth()-11+i,1));const years=[...new Set([...Array.from({length:5},(_,i)=>currentDate.getFullYear()-i),...state.income.map(x=>parseDate(x.income_date)?.getFullYear()).filter(Boolean)])].sort((a,b)=>b-a);const sub=subs.reports||'12m';const header=subNav('reports',[['12m','12-month'],['annual','Annual']]);let body='';if(sub==='12m'){const rows=s12.map(d=>({d,s:monthStats(d)})),max=Math.max(1,...rows.flatMap(x=>[x.s.income,x.s.expenses]));body=`<div class="panel">${sectionHead('12-month cash flow','Income and outflow for each month.')}<div class="chart">${rows.map(x=>`<div class="bar-col"><span class="bar-value">${Math.round(x.s.income/1000)}k</span><div class="bar" title="Income ${money(x.s.income)}" style="height:${Math.max(2,x.s.income/max*130)}px"></div><span class="bar-label">${x.d.toLocaleDateString('en-IN',{month:'short'})}</span><div class="bar" title="Expense ${money(x.s.expenses)}" style="height:${Math.max(2,x.s.expenses/max*130)}px;background:linear-gradient(180deg,#ff9b9b,#dc3636)"></div></div>`).join('')}</div><div class="item-meta" style="margin-top:9px"><span class="badge" style="background:#e7efff;color:#2459d6">● Income</span> <span class="badge" style="background:#ffebeb;color:#b62a2a">● Expense</span></div><div class="table-wrap" style="margin-top:15px"><table><thead><tr><th>Month</th><th>Income</th><th>Expense</th><th>Net</th><th>Pending</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${monthName(x.d)}</td><td class="green">${money(x.s.income)}</td><td class="red">${money(x.s.expenses)}</td><td class="${x.s.net>=0?'green':'red'}">${money(x.s.net)}</td><td>${money(x.s.pending)}</td></tr>`).join('')}</tbody></table></div></div>`;}else{body=`<div class="panel">${sectionHead('Annual summary','Summarises recorded cash-flow entries by calendar year.')}<div class="table-wrap"><table><thead><tr><th>Year</th><th>Income</th><th>Outflow</th><th>Net</th></tr></thead><tbody>${years.map(y=>{const ms=Array.from({length:12},(_,m)=>monthStats(new Date(y,m,1))),inc=ms.reduce((s,x)=>s+x.income,0),exp=ms.reduce((s,x)=>s+x.expenses,0);return `<tr><td>${y}</td><td class="green">${money(inc)}</td><td class="red">${money(exp)}</td><td class="${inc>=exp?'green':'red'}">${money(inc-exp)}</td></tr>`;}).join('')}</tbody></table></div></div>`;}$('#view-reports').innerHTML=header+body;}
let activeTool='recurring';
function renderHealth(){const s=monthStats(currentDate),debt=state.loans.reduce((a,l)=>a+num(l.outstanding_amount),0),goalT=state.savingsGoals.reduce((a,g)=>a+num(g.target_amount),0),goalC=state.savingsGoals.reduce((a,g)=>a+num(g.current_amount),0),savingRate=s.income?Math.round(s.net/s.income*100):0,score=Math.max(0,Math.min(100,Math.round(50+savingRate*.7-(s.pending/Math.max(1,s.expenses))*18+(goalC/Math.max(1,goalT))*12)));return `<div class="panel">${sectionHead('Financial health','A transparent snapshot based on recorded income, pending commitments, debt and goals.')}<div class="hero"><div class="card"><div class="health-top"><div><div class="muted small">Estimated health score</div><div class="health-score">${score}<span class="muted small"> / 100</span></div><div class="muted small">Savings rate ${savingRate}%</div></div><div class="ring" style="--pct:${score}"><span>${score}</span></div></div><div class="progress" style="margin-top:20px"><span style="width:${score}%"></span></div><p class="muted small" style="margin:9px 0 0">This score is a guide, not credit scoring or financial advice.</p></div><div class="card"><div class="kpi-label">Current month</div><div class="kpi-value ${s.net>=0?'green':'red'}">${money(s.net)}</div><div class="kpi-foot">Net cash flow</div><div class="divider"></div><div class="status-row"><span class="muted small">Pending commitments</span><b>${money(s.pending)}</b></div><div class="status-row" style="margin-top:9px"><span class="muted small">Outstanding loans</span><b>${money(debt)}</b></div><div class="status-row" style="margin-top:9px"><span class="muted small">Goal progress</span><b>${goalT?Math.round(goalC/goalT*100):0}%</b></div></div></div><h3>Why the score looks this way</h3>${s.net<0?`<div class="attention"><span class="attention-dot" style="background:var(--red)"></span><div><b>Spending exceeds recorded income</b><p>Current-month tracked outflow is greater than inflow by ${money(Math.abs(s.net))}.</p></div></div>`:`<div class="attention"><span class="attention-dot" style="background:var(--green)"></span><div><b>Positive monthly net</b><p>Current-month income exceeds recorded outflow by ${money(s.net)}.</p></div></div>`}${s.pending>0?`<div class="attention"><span class="attention-dot" style="background:var(--amber)"></span><div><b>Pending payments remain</b><p>${money(s.pending)} of commitments are not marked paid.</p></div></div>`:''}${goalT>0&&goalC<goalT?`<div class="attention"><span class="attention-dot"></span><div><b>Goals need ${money(goalT-goalC)} more</b><p>Review the monthly contribution needed on the Goals page.</p></div></div>`:''}</div>`;}
function renderAssistant(){const s=monthStats(currentDate),cat={};s.events.filter(e=>e.type!=='income').forEach(e=>cat[e.category]=(cat[e.category]||0)+e.amount);const top=Object.entries(cat).sort((a,b)=>b[1]-a[1]).slice(0,3);const previous=new Date(currentDate.getFullYear(),currentDate.getMonth()-1,1),prev=monthStats(previous);const change=s.expenses-prev.expenses;return `<div class="panel">${sectionHead('Financial assistant','A short, rules-based explanation of your current records. This is not a bank connection or an AI chat.')}<div class="card"><h3>${s.net<0?'Cash flow needs attention':s.net>0?'You have a positive net cash flow':'Your current month is break-even'}</h3><p class="muted small">${s.net<0?`Tracked outflow exceeds tracked income by ${money(Math.abs(s.net))}. Review the upcoming commitments and see whether any expenses can be delayed.`:s.net>0?`You have a tracked surplus of ${money(s.net)} this month. Consider allocating part of it to an emergency fund or your highest-interest debt.`:'Recorded monthly income and outflow currently balance.'}</p></div><div class="grid two-col" style="margin-top:12px"><div class="card"><h3>Largest outflow categories</h3><div class="list">${top.map(([c,v])=>`<div class="status-row"><span>${esc(c)}</span><b>${money(v)}</b></div>`).join('')||'<div class="empty">No expense categories yet.</div>'}</div></div><div class="card"><h3>Month-over-month</h3><div class="kpi-value ${change<=0?'green':'red'}">${change>0?'+':''}${money(change)}</div><div class="kpi-foot">Expense change vs ${monthName(previous)}. ${change>0?'Outflow increased.':'Outflow decreased or stayed level.'}</div><div class="divider"></div><button class="btn btn-soft" data-tab="reports">Open reports</button></div></div></div>`;}
function renderRecurringIntelligence(){const ann=state.expenses.reduce((s,e)=>s+num(e.amount)*12/freqMonths(e.frequency),0),cats={};state.expenses.forEach(e=>cats[e.category||'Other']=(cats[e.category||'Other']||0)+num(e.amount)*12/freqMonths(e.frequency));const repeated={};state.oneTimeExpenses.forEach(e=>{const k=String(e.name||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();if(k)repeated[k]=(repeated[k]||0)+1;});const possible=Object.entries(repeated).filter(([,n])=>n>=2).sort((a,b)=>b[1]-a[1]);return `<div class="panel">${sectionHead('Recurring Expense Intelligence','Annualise recurring schedules, rank categories, and flag repeated one-time labels. This page is independent of Assistant and Home.')}<div class="grid three-col">${kpi('Annual scheduled outflow',money(ann),'Recurring expenses only')}${kpi('Monthly equivalent',money(ann/12),'Average monthly run rate')}${kpi('Recurring schedules',state.expenses.length,'Expense schedules tracked')}</div><div class="grid two-col" style="margin-top:14px"><div class="card"><h3>Annual cost by category</h3><div class="list">${Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,v])=>`<div><div class="status-row"><span class="small">${esc(c)}</span><b>${money(v)}</b></div><div class="progress" style="margin-top:6px"><span style="width:${ann?Math.min(100,v/ann*100):0}%"></span></div></div>`).join('')||'<div class="empty">Add recurring expenses to calculate annual commitments.</div>'}</div></div><div class="card"><h3>Schedules to review</h3><div class="list">${state.expenses.slice().sort((a,b)=>(num(b.amount)*12/freqMonths(b.frequency))-(num(a.amount)*12/freqMonths(a.frequency))).slice(0,7).map(e=>`<div class="item"><div class="item-main"><b class="item-title">${esc(e.name)}</b><div class="item-meta">${esc(e.category||'Other')} · ${esc(e.frequency||'Monthly')} · Due day ${esc(e.due_day)}</div></div><div class="item-amount">${money(num(e.amount)*12/freqMonths(e.frequency))}<div class="small muted">annual</div></div><button class="btn btn-quiet" data-edit="expenses" data-id="${esc(e.id)}">Edit</button></div>`).join('')||'<div class="empty">No recurring expense schedules found.</div>'}</div><div class="divider"></div><h3>Repeated one-time expense labels</h3><div class="list">${possible.map(([n,count])=>`<div class="status-row"><span class="small">${esc(n)}</span><span class="badge warn">${count} entries</span></div>`).join('')||'<div class="muted small">No repeated labels found among one-time expenses yet.</div>'}</div><div class="notice">Repeated labels are only candidates to review. The app will never convert these entries into recurring schedules automatically.</div></div></div></div>`;}
function eventsInRange(days){const now=new Date();now.setHours(0,0,0,0);const end=new Date(now);end.setDate(end.getDate()+days);const months=[];for(let i=0;i<=1;i++)months.push(new Date(now.getFullYear(),now.getMonth()+i,1));const seen=new Set(),all=[];months.forEach(m=>eventsForMonth(m).forEach(e=>{const d=parseDate(e.date);const key=universalKey(e);if(d&&d>=now&&d<=end&&!seen.has(key)){seen.add(key);all.push(e);}}));return all.sort((a,b)=>a.date.localeCompare(b.date));}

const BACKUP_ARRAY_KEYS=['expenses','payments','income','recurringIncome','loans','savingsGoals','savingsTransactions','budgets','creditCards','assets','investments','oneTimeExpenses','financeRules','renewals','vehicles','vehicleLogs','householdBills','lifeEvents','documents'];

 for(const x of getBackupArray(b,'documents')){try{const row={title:x.title||x.name||'Document reference',type:x.type||x.document_type||'Other',file_name:x.file_name||null,mime_type:x.mime_type||null,size_bytes:x.size_bytes??null,file_url:x.file_url||x.url||null,notes:x.notes||null};await insertRestored('documents',row,['title','type','file_name','mime_type','size_bytes','file_url','notes']);done++;}catch(err){errors.push('documents: '+err.message);skipped++;}}
 // Map old universal payment-status record keys to the new restored IDs.
 const oldPaid=b.universalPaidState||{};for(const [key,val] of Object.entries(oldPaid)){const [kind,oldId,date]=key.split('|');const map=kind==='expenses'?maps.expenses:kind==='loans'?{}:{};const newId=map[oldId]||oldId;state.universalPaidState[`${kind}|${newId}|${date}`]=!!val;}saveOffline();
 if(!IS_DEMO)await loadData();else renderAll();closeModal();showToast(`Restore finished: ${done} records restored${skipped?`, ${skipped} skipped`:''}.`);if(errors.length){console.warn('Restore warnings',errors);openModal('Restore completed with warnings',`${done} records restored; ${skipped} skipped.`, `<div class="list">${errors.slice(0,12).map(x=>`<div class="attention"><span class="attention-dot" style="background:var(--amber)"></span><div class="small">${esc(x)}</div></div>`).join('')}</div><div class="form-footer"><button class="btn btn-primary" data-close>Close</button></div>`);}
 }catch(err){showToast('Restore failed: '+err.message);console.error(err);}}
function closeMenu(){$('#moreMenu').classList.add('hidden');$('#moreBtn').setAttribute('aria-expanded','false');}
function openAppearance(){const theme=localStorage.getItem('expense-calendar-theme')||'system',compact=localStorage.getItem('expense-calendar-compact')==='1';openModal('Appearance','Changes apply immediately on this device.',`<form id="appearanceForm"><div class="field"><label for="themeChoice">Theme</label><select id="themeChoice"><option value="light" ${theme==='light'?'selected':''}>Light</option><option value="dark" ${theme==='dark'?'selected':''}>Dark</option><option value="system" ${theme==='system'?'selected':''}>System</option></select></div><div class="field" style="margin-top:12px"><label><input id="compactChoice" type="checkbox" style="width:auto;margin-right:8px" ${compact?'checked':''}>Use compact spacing</label></div><div class="form-footer"><button class="btn btn-quiet" type="button" data-close>Cancel</button><button class="btn btn-primary">Save appearance</button></div></form>`);$('#appearanceForm').onsubmit=e=>{e.preventDefault();localStorage.setItem('expense-calendar-theme',$('#themeChoice').value);localStorage.setItem('expense-calendar-compact',$('#compactChoice').checked?'1':'0');applyPreferences();closeModal();showToast('Appearance updated');};}
function applyPreferences(){const theme=localStorage.getItem('expense-calendar-theme')||'system';document.body.classList.toggle('dark',theme==='dark'||(theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches));document.body.classList.toggle('compact',localStorage.getItem('expense-calendar-compact')==='1');document.body.classList.toggle('privacy',privacyMode||localStorage.getItem('expense-calendar-privacy')==='1');}
function openAccount(){openModal('Account & Security','Manage account details through your signed-in session.',`<div class="card"><div class="muted small">Signed in as</div><b>${esc(currentUser?.email||'Demo account')}</b></div><form id="passwordForm" style="margin-top:15px"><h3>Change password</h3><div class="field"><label>New password</label><input id="newPassword" type="password" minlength="6" required></div><div class="form-footer"><button class="btn btn-primary">Update password</button></div></form><div class="divider"></div><form id="emailForm"><h3>Change email</h3><div class="field"><label>New email</label><input id="newEmail" type="email" required></div><div class="form-footer"><button class="btn btn-soft">Update email</button></div></form><div class="form-footer"><button class="btn btn-quiet" data-close>Close</button></div>`);$('#passwordForm').onsubmit=async e=>{e.preventDefault();const p=$('#newPassword').value;if(IS_DEMO){showToast('Demo mode does not change account credentials');return;}const {error}=await supabaseClient.auth.updateUser({password:p});if(error)showToast(error.message);else{showToast('Password updated');$('#newPassword').value='';}};$('#emailForm').onsubmit=async e=>{e.preventDefault();if(IS_DEMO){showToast('Demo mode does not change account credentials');return;}const {error}=await supabaseClient.auth.updateUser({email:$('#newEmail').value.trim()});if(error)showToast(error.message);else showToast('Check your email to confirm the change');};}
function openForgot(){openModal('Reset password','We will send a reset link to your email.',`<form id="forgotForm"><div class="field"><label>Email</label><input id="forgotEmail" type="email" value="${esc($('#loginEmail').value)}" required></div><div class="form-footer"><button class="btn btn-quiet" type="button" data-close>Cancel</button><button class="btn btn-primary">Send reset link</button></div></form>`);$('#forgotForm').onsubmit=async e=>{e.preventDefault();if(IS_DEMO){showToast('Demo mode has no email service');return;}const {error}=await supabaseClient.auth.resetPasswordForEmail($('#forgotEmail').value.trim(),{redirectTo:APP_URL});if(error)showToast(error.message);else{closeModal();setAuthMessage('If the account can receive a reset email, a secure link has been sent.');}};}
async function createShared(){const name=prompt('Household name:','Family');if(!name?.trim())return;if(IS_DEMO){state.sharedHouseholds.push({id:'demo-house-'+Date.now(),name:name.trim(),owner_id:currentUser.id});renderAll();showToast('Sample household created');return;}const {error}=await supabaseClient.rpc('create_shared_household',{p_name:name.trim()});if(error){showToast('Could not create household: '+error.message);return;}await loadData();}
async function inviteShared(){if(!state.sharedHouseholds.length){showToast('Create or join a household first');return;}const email=prompt('Email of an existing Expense Calendar user:');if(!email)return;if(IS_DEMO){showToast('Invites are disabled in demo mode');return;}const h=state.sharedHouseholds.find(x=>x.owner_id===currentUser.id)||state.sharedHouseholds[0];const {error}=await supabaseClient.rpc('add_shared_member',{p_household_id:h.id,p_email:email.trim()});if(error)showToast(error.message);else{showToast('Invite request sent');await loadData();}}
function openSharedExpense(id=null){if(!state.sharedHouseholds.length){showToast('Create or join a shared household first');return;}const r=id?state.sharedExpenses.find(x=>x.id===id):null;openModal(r?'Edit shared expense':'Add shared expense','Shared expenses are visible to household members.',`<form id="sharedExpenseForm"><div class="form-grid"><div class="field"><label>Household</label><select name="household_id">${state.sharedHouseholds.map(h=>`<option value="${esc(h.id)}" ${h.id===(r?.household_id||state.sharedHouseholds[0].id)?'selected':''}>${esc(h.name)}</option>`).join('')}</select></div><div class="field"><label>Description</label><input name="name" required value="${esc(r?.name||'')}"></div><div class="field"><label>Amount (₹)</label><input name="amount" type="number" min="0.01" step="any" required value="${esc(r?.amount??'')}"></div><div class="field"><label>Date</label><input name="expense_date" type="date" required value="${esc(r?.expense_date||todayIso())}"></div></div><div class="form-footer"><button class="btn btn-quiet" type="button" data-close>Cancel</button><button class="btn btn-primary">Save shared expense</button></div></form>`);$('#sharedExpenseForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget),row={household_id:f.get('household_id'),name:String(f.get('name')).trim(),amount:Number(f.get('amount')),expense_date:f.get('expense_date')};try{if(IS_DEMO){if(id){Object.assign(r,row);}else state.sharedExpenses.push({id:'demo-share-'+Date.now(),user_id:currentUser.id,...row});}else{let q=id?supabaseClient.from('shared_expenses').update(row).eq('id',id).eq('user_id',currentUser.id):supabaseClient.from('shared_expenses').insert({user_id:currentUser.id,...row});const {data,error}=await q.select().single();if(error)throw error;if(id)Object.assign(r,data);else state.sharedExpenses.unshift(data);}closeModal();renderAll();showToast('Shared expense saved');}catch(err){showToast(err.message);}};}
function startApp(user){currentUser=user;$('#authScreen').classList.add('hidden');$('#app').classList.remove('hidden');if(!IS_DEMO){try{const saved=JSON.parse(localStorage.getItem('expense-calendar-paid-'+user.id)||'{}');state.universalPaidState={...saved,...state.universalPaidState};}catch(_){}}loadData().catch(err=>{setSync('● Load error','warning');showToast('Could not load finance data: '+err.message);});renderAll();}
function showAuth(){$('#app').classList.add('hidden');$('#authScreen').classList.remove('hidden');}
function installAuthHandlers(){ $('#loginForm').onsubmit=async e=>{e.preventDefault();if(IS_DEMO){showToast('You are in sample mode');return;}try{const {data,error}=await supabaseClient.auth.signInWithPassword({email:$('#loginEmail').value.trim(),password:$('#loginPassword').value});if(error)throw error;startApp(data.user);setAuthMessage('');}catch(err){setAuthMessage(err.message||'Sign-in failed',true);}};$('#showSignup').onclick=()=>{$('#signupBox').classList.toggle('hidden');$('#signupEmail').value=$('#loginEmail').value.trim();};$('#showForgot').onclick=openForgot;$('#signupForm').onsubmit=async e=>{e.preventDefault();if(IS_DEMO)return;try{const {data,error}=await supabaseClient.auth.signUp({email:$('#signupEmail').value.trim(),password:$('#signupPassword').value,options:{emailRedirectTo:APP_URL}});if(error)throw error;if(data.session){startApp(data.user);setAuthMessage('');}else{setAuthMessage('Account created. Check your email for the confirmation link.');$('#signupBox').classList.add('hidden');}}catch(err){setAuthMessage(err.message||'Sign-up failed',true);}};}
function handleAction(action){closeMenu();switch(action){case'backup':downloadBackup();break;case'restore':openRestore();break;case'refresh':loadData().then(()=>showToast('Data refreshed')).catch(e=>showToast(e.message));break;case'privacy':privacyMode=!privacyMode;localStorage.setItem('expense-calendar-privacy',privacyMode?'1':'0');applyPreferences();showToast(privacyMode?'Privacy mode on':'Privacy mode off');break;case'appearance':openAppearance();break;case'account':openAccount();break;}}
document.addEventListener('click',async e=>{
 const t=e.target.closest('button,[data-tab],[data-sub],[data-entry],[data-edit],[data-delete],[data-paid],[data-tool]');if(!t)return;
 if(t.id==='moreBtn'){const isOpen=!$('#moreMenu').classList.contains('hidden');$('#moreMenu').classList.toggle('hidden',isOpen);$('#moreBtn').setAttribute('aria-expanded',String(!isOpen));return;}
 if(t.dataset.action){e.preventDefault();handleAction(t.dataset.action);return;}
 if(t.dataset.tab){e.preventDefault();switchTab(t.dataset.tab);return;}
 if(t.dataset.sub){e.preventDefault();setSub(t.dataset.section,t.dataset.sub);return;}
 if(t.dataset.tool){e.preventDefault();activeTool=t.dataset.tool;renderInsights();return;}
 if(t.dataset.entry){e.preventDefault();openEntry(t.dataset.entry);return;}
 if(t.dataset.entryOpen){e.preventDefault();const pref=t.dataset.vehicle?{vehicle_id:t.dataset.vehicle}:{};openEntry(t.dataset.entryOpen,null,pref);return;}
 if(t.dataset.edit){e.preventDefault();openEntry(t.dataset.edit,t.dataset.id);return;}
 if(t.dataset.delete){e.preventDefault();if(t.dataset.delete==='sharedExpenses'){if(!confirm('Delete this shared expense?'))return;if(IS_DEMO){state.sharedExpenses=state.sharedExpenses.filter(x=>x.id!==t.dataset.id);renderAll();return;}const {error}=await supabaseClient.from('shared_expenses').delete().eq('id',t.dataset.id).eq('user_id',currentUser.id);if(error){showToast(error.message);return;}state.sharedExpenses=state.sharedExpenses.filter(x=>x.id!==t.dataset.id);renderAll();showToast('Shared expense deleted');}else await deleteRow(t.dataset.delete,t.dataset.id);return;}
 if(t.dataset.paid){e.preventDefault();const [kind,id,date]=t.dataset.paid.split('|');const evt=eventsForMonth(currentDate).find(x=>x.kind===kind&&x.id===id&&x.date===date);if(evt)await markPaid(evt,!evt.paid);return;}
 if(t.dataset.contribute){const g=state.savingsGoals.find(x=>x.id===t.dataset.contribute);if(!g)return;const ans=prompt(`How much are you adding to “${g.name}”?`,'1000');if(ans===null)return;const amt=Number(ans);if(!Number.isFinite(amt)||amt<=0){showToast('Enter an amount greater than zero');return;}try{await saveRow('savingsTransactions',{goal_id:g.id,amount:amt,transaction_date:todayIso(),note:'Goal contribution'});await saveRow('savingsGoals',{name:g.name,target_amount:g.target_amount,current_amount:num(g.current_amount)+amt,target_date:g.target_date||null},g.id);showToast('Goal contribution saved');}catch(err){showToast(err.message);}return;}
 if(t.dataset.newBudget){openEntry('budgets',null,{category:t.dataset.newBudget});return;}
 if(t.dataset.balance){const loan=state.loans.find(x=>x.id===t.dataset.balance);if(!loan)return;const ans=prompt('Enter current outstanding balance (₹):',String(loan.outstanding_amount));if(ans===null)return;const val=Number(ans);if(!Number.isFinite(val)||val<0||val>num(loan.original_amount)){showToast('Enter a valid balance between zero and original loan amount');return;}try{await saveRow('loans',{name:loan.name,lender:loan.lender,original_amount:loan.original_amount,outstanding_amount:val,interest_rate:loan.interest_rate,emi_amount:loan.emi_amount,start_date:loan.start_date,tenure_months:loan.tenure_months},loan.id);showToast('Loan balance updated');}catch(err){showToast(err.message);}return;}
 if(t.id==='alertsBtn'){openAlerts();return;}
 if(t.id==='addEntryBtn'||t.id==='mobileAdd'){showPicker();return;}
 if(t.id==='quickAddBtn'){openQuickAdd();return;}
 if(t.id==='homeCalendar'){switchTab('calendar');return;}if(t.id==='homePlanning'){switchTab('planning');return;}
 if(t.id==='installBtn'){if(deferredInstallPrompt){deferredInstallPrompt.prompt();await deferredInstallPrompt.userChoice;deferredInstallPrompt=null;}else showToast('Install is available from your browser menu when supported.');return;}
 if(t.id==='logoutBtn'){if(IS_DEMO){showAuth();return;}const {error}=await supabaseClient.auth.signOut();if(error){showToast(error.message);return;}currentUser=null;showAuth();return;}
 if(t.id==='createHousehold'){await createShared();return;}if(t.id==='inviteHousehold'){await inviteShared();return;}if(t.id==='addSharedExpense'){openSharedExpense();return;}if(t.dataset.editShared){openSharedExpense(t.dataset.editShared);return;}
 if(t.dataset.editHousehold){const h=state.sharedHouseholds.find(x=>x.id===t.dataset.editHousehold);if(!h)return;const name=prompt('Household name',h.name);if(!name?.trim())return;if(IS_DEMO){h.name=name.trim();renderAll();return;}const {data,error}=await supabaseClient.from('shared_households').update({name:name.trim()}).eq('id',h.id).eq('owner_id',currentUser.id).select().single();if(error)showToast(error.message);else{Object.assign(h,data);renderAll();}return;}
 if(t.hasAttribute('data-close')){closeModal();return;}
});
document.addEventListener('click',e=>{if(!e.target.closest('.menu-wrap'))closeMenu();});$('#modalClose').onclick=closeModal;$('#modalBackdrop').addEventListener('click',e=>{if(e.target===$('#modalBackdrop'))closeModal();});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenu();}});

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstallPrompt=e;});
window.addEventListener('online',()=>{if(currentUser&&!IS_DEMO)loadData().catch(()=>{});});window.addEventListener('offline',()=>setSync('● Offline','offline'));document.addEventListener('visibilitychange',()=>{if(!document.hidden)formatTimeGreeting();});setInterval(formatTimeGreeting,30000);matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{if((localStorage.getItem('expense-calendar-theme')||'system')==='system')applyPreferences();});
async function boot(){installAuthHandlers();applyPreferences();try{if(IS_DEMO){currentUser={id:'sample-user',email:'sample@example.test'};demoSeed();$('#authScreen').classList.add('hidden');$('#app').classList.remove('hidden');setSync('● Sample data','demo');renderAll();return;}await initBackend();const {data,error}=await supabaseClient.auth.getSession();if(error)throw error;if(data.session?.user){startApp(data.session.user);}else showAuth();supabaseClient.auth.onAuthStateChange((event,session)=>{if(session?.user){if(currentUser?.id!==session.user.id)startApp(session.user);}else if(event==='SIGNED_OUT'){currentUser=null;showAuth();}});if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(err){showAuth();setAuthMessage(err.message||'Could not start Expense Calendar',true);}}
// The clean renderer owns all six sections and updates the greeting from the browser's local clock.
boot();
